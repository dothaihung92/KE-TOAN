<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tra cứu hoá đơn điện tử{% endblock %}</title>
  <style>
    :root { --xanh:#0b6e4f; --xanh2:#0e8a63; --xam:#f4f6f8; --vien:#dfe3e8; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
           background:var(--xam); color:#1f2933; }
    header { background:var(--xanh); color:#fff; padding:14px 22px; display:flex;
             align-items:center; justify-content:space-between; }
    header a { color:#fff; text-decoration:none; }
    header .brand { font-weight:700; font-size:18px; }
    header nav a { margin-left:16px; font-size:14px; opacity:.92; }
    .wrap { max-width:1100px; margin:22px auto; padding:0 18px; }
    .card { background:#fff; border:1px solid var(--vien); border-radius:10px;
            padding:20px; margin-bottom:18px; }
    h1 { font-size:20px; margin:0 0 14px; }
    h2 { font-size:16px; margin:0 0 12px; }
    table { width:100%; border-collapse:collapse; font-size:13px; }
    th,td { border:1px solid var(--vien); padding:7px 9px; text-align:left;
            white-space:nowrap; }
    th { background:#eef6f2; position:sticky; top:0; }
    tr:nth-child(even) td { background:#fafbfc; }
    .tablebox { overflow:auto; max-height:520px; border:1px solid var(--vien);
                border-radius:8px; }
    .btn { display:inline-block; background:var(--xanh); color:#fff; border:none;
           padding:9px 16px; border-radius:7px; cursor:pointer; font-size:14px;
           text-decoration:none; }
    .btn:hover { background:var(--xanh2); }
    .btn.sec { background:#fff; color:var(--xanh); border:1px solid var(--xanh); }
    .btn.danger { background:#c0392b; }
    .btn.sm { padding:5px 10px; font-size:13px; }
    input,select { padding:9px 10px; border:1px solid var(--vien); border-radius:7px;
                   font-size:14px; width:100%; }
    label { display:block; font-size:13px; font-weight:600; margin:10px 0 5px; }
    .row { display:flex; gap:16px; flex-wrap:wrap; }
    .row > div { flex:1; min-width:180px; }
    .flash { padding:11px 14px; border-radius:8px; margin-bottom:12px; font-size:14px; }
    .flash.ok { background:#e3f5ec; color:#0b6e4f; border:1px solid #9bd9bd; }
    .flash.error { background:#fdecea; color:#a93226; border:1px solid #f1b0a8; }
    .muted { color:#67737e; font-size:13px; }
    .pill { background:#eef6f2; color:var(--xanh); padding:2px 9px; border-radius:20px;
            font-size:12px; }
    .actions { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .checks label { display:inline-flex; align-items:center; gap:6px; font-weight:500;
                    margin-right:16px; }
    .checks input { width:auto; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="{{ url_for('index') }}">🧾 Hoá đơn điện tử — Kế toán</a>
    <nav>
      <a href="{{ url_for('index') }}">Công ty</a>
      <a href="{{ url_for('company_add') }}">+ Thêm công ty</a>
      {% if session.get('active') %}<a href="{{ url_for('logout') }}">Đăng xuất</a>{% endif %}
    </nav>
  </header>
  <div class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="flash {{ cat }}">{{ msg }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
