<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Ke Toan AI</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f5f5;color:#1a1a1a;font-size:14px}
  :root{--green:#1a7a4a;--green-l:#e6f5ed;--green-d:#0d5c38;--blue:#1a5276;--blue-l:#ebf5fb;--amber:#8a5c0a;--amber-l:#fef5e4;--red:#8a2020;--red-l:#fdeaea;--purple:#4a3d9e;--purple-l:#eeedfe;--border:#e0e0e0;--bg:#f5f5f5;--card:#fff;--text:#1a1a1a;--text2:#555;--text3:#888}
  .card{background:var(--card);border-radius:10px;border:1px solid var(--border);padding:1rem}
  .btn{height:34px;padding:0 16px;border-radius:7px;border:none;font-size:13px;cursor:pointer;font-weight:500;white-space:nowrap;transition:.15s}
  .btn-green{background:var(--green);color:#fff}.btn-green:hover{background:var(--green-d)}
  .btn-green:disabled{background:#ccc;cursor:not-allowed}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-amber{background:#c07010;color:#fff}
  .btn-outline{background:#fff;border:1px solid var(--border)!important;color:var(--text2)}
  .btn-outline:hover{background:#f9f9f9}
  input,select,textarea{font-family:inherit;font-size:13px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:#fff;color:var(--text);outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--green)}
  input{height:34px} select{height:34px}
  textarea{padding:8px 10px;resize:vertical;line-height:1.6}
  label{font-size:11px;color:var(--text2);display:block;margin-bottom:3px}
  .badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500}
  .badge-green{background:var(--green-l);color:var(--green-d)}
  .badge-amber{background:var(--amber-l);color:var(--amber)}
  .badge-red{background:var(--red-l);color:var(--red)}
  .badge-blue{background:var(--blue-l);color:var(--blue)}
  .badge-purple{background:var(--purple-l);color:var(--purple)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{text-align:left;padding:8px 10px;background:#f8f8f8;border-bottom:1px solid var(--border);font-weight:500;color:var(--text2);white-space:nowrap}
  td{padding:7px 10px;border-bottom:1px solid #f0f0f0;vertical-align:top}
  tr:hover td{background:#fafafa}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .grid4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:10px}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .stat-card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:.75rem 1rem}
  .stat-val{font-size:24px;font-weight:600;margin-top:2px}
  .spinner{width:36px;height:36px;border:3px solid #eee;border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto}
  @keyframes spin{to{transform:rotate(360deg)}}
  .toast{position:fixed;top:20px;right:20px;z-index:9999;padding:10px 18px;border-radius:8px;color:#fff;font-size:13px;font-weight:500;box-shadow:0 4px 16px rgba(0,0,0,.2);animation:fadeIn .2s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
  .sidebar{width:220px;min-height:100vh;background:#fff;border-right:1px solid var(--border);padding:1rem;position:fixed;top:0;left:0;overflow-y:auto}
  .main{margin-left:220px;padding:1.5rem;min-height:100vh}
  .nav-item{padding:8px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--text2);transition:.1s;margin-bottom:3px}
  .nav-item:hover{background:#f5f5f5}
  .nav-item.active{background:var(--green-l);color:var(--green-d);font-weight:500}
  .confirm-row{border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:8px;transition:.2s}
  .confirm-row.confirmed{background:var(--green-l);border-color:#b8e0c8}
  .confirm-row.rejected{background:var(--red-l);border-color:#f5c0c0}
  .step-bar{display:flex;margin-bottom:1rem}
  .step{flex:1;padding:10px;text-align:center;background:#f8f8f8;border:1px solid var(--border);cursor:pointer;font-size:13px}
  .step:first-child{border-radius:8px 0 0 8px}
  .step:last-child{border-radius:0 8px 8px 0}
  .step.active{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:500}
  .tab{padding:6px 14px;border-radius:7px;border:1px solid var(--border);background:#fff;font-size:12px;cursor:pointer;color:var(--text2)}
  .tab.active{background:var(--green-l);border-color:var(--green);color:var(--green-d);font-weight:500}
  @media(max-width:700px){.sidebar{display:none}.main{margin-left:0}}
</style>

<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>const {
  useState,
  useEffect,
  useCallback,
  useRef
} = React;

// ── Auto-update: kiểm tra bản mới trên GitHub mỗi khi mở file ─────────────────
// Tăng số này lên mỗi khi có thay đổi được đẩy lên GitHub, để app tự nhận biết
// có bản mới hơn bản đang chạy trên máy người dùng.
const APP_VERSION = "2026.07.06.08";
const GITHUB_RAW_URL = "https://raw.githubusercontent.com/dothaihung92/NGANHANG/claude/bank-reconciliation-review-a1rpwp/KeToanAI_v4.html";

// ── Storage ──────────────────────────────────────────────────────────────────
const LS = {
  get: k => {
    try {
      const v = localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch {
      return null;
    }
  },
  set: (k, v) => {
    try {
      // Tự đóng dấu thời điểm lưu (_savedAt) cho MỌI phiên làm việc (session_...) — không cần sửa
      // từng chỗ gọi LS.set rải rác khắp file, chỉ cần chặn ở đây 1 chỗ duy nhất. Dùng để biết công
      // ty nào vừa xử lý gần đây nhất (sắp xếp "Tiếp tục" lên đầu danh sách công ty).
      if (k.indexOf("session_") === 0 && v && typeof v === "object" && !Array.isArray(v)) {
        v = { ...v, _savedAt: Date.now() };
      }
      localStorage.setItem(k, JSON.stringify(v));
      try { if (window.__FS && window.__FS.handle) window.__FS.schedule(); } catch(e) {}
      return true;
    } catch(e) {
      // Hết dung lượng → vẫn cố ghi ra file máy nếu đã liên kết
      try { if (window.__FS && window.__FS.handle) window.__FS.schedule(); } catch(e2) {}
      return false;
    }
  },
  del: k => {
    try {
      localStorage.removeItem(k);
      try { if (window.__FS && window.__FS.handle) window.__FS.schedule(); } catch(e) {}
    } catch {}
  },
  // Scan keys by prefix
  scan: prefix => {
    const keys = [];
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) keys.push(k);
      }
    } catch(e) {}
    return keys;
  }
};

// ── Lưu dữ liệu ra FILE TRÊN MÁY TÍNH (File System Access API) ────────────────
// localStorage chỉ là bộ đệm nhanh; file trên máy là nơi lưu bền vững, không bị đầy.
const FS = {
  handle: null,
  timer: null,
  supported: (typeof window !== "undefined" && "showSaveFilePicker" in window),
  // Gom toàn bộ dữ liệu app thành 1 object
  gatherAll() {
    const d = {};
    try {
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k) d[k] = localStorage.getItem(k);
      }
    } catch(e) {}
    return d;
  },
  // Khôi phục toàn bộ dữ liệu vào localStorage
  restoreAll(d) {
    try {
      Object.entries(d || {}).forEach(([k, v]) => {
        try { localStorage.setItem(k, typeof v === "string" ? v : JSON.stringify(v)); } catch(e) {}
      });
      return true;
    } catch(e) { return false; }
  },
  // Ghi ra file (cần handle)
  async write() {
    if (!this.handle) return false;
    try {
      let perm = await this.handle.queryPermission({ mode: "readwrite" });
      if (perm !== "granted") perm = await this.handle.requestPermission({ mode: "readwrite" });
      if (perm !== "granted") return false;
      const w = await this.handle.createWritable();
      await w.write(JSON.stringify(this.gatherAll()));
      await w.close();
      return true;
    } catch(e) { return false; }
  },
  // Lên lịch ghi (debounce) — gọi sau mỗi lần LS.set
  schedule() {
    if (!this.handle) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => { this.write(); }, 1200);
  },
  // IndexedDB lưu handle để dùng lại sau khi tải lại trang
  _idb(cb) {
    try {
      const r = indexedDB.open("ketoan_fs", 1);
      r.onupgradeneeded = () => { try { r.result.createObjectStore("h"); } catch(e) {} };
      r.onsuccess = () => cb(r.result);
      r.onerror = () => cb(null);
    } catch(e) { cb(null); }
  },
  saveHandle(h) {
    this._idb(db => { if (!db) return; try { const t = db.transaction("h", "readwrite"); t.objectStore("h").put(h, "file"); } catch(e) {} });
  },
  loadHandle(cb) {
    this._idb(db => { if (!db) { cb(null); return; } try { const t = db.transaction("h", "readonly"); const g = t.objectStore("h").get("file"); g.onsuccess = () => cb(g.result || null); g.onerror = () => cb(null); } catch(e) { cb(null); } });
  }
};
if (typeof window !== "undefined") window.__FS = FS;

// Session index: track all saved sessions per company for reliable detection
function addToSessionIndex(coId, sessionKey) {
  try {
    const idx = LS.get("sesidx_" + coId) || [];
    if (!idx.includes(sessionKey)) {
      idx.push(sessionKey);
      LS.set("sesidx_" + coId, idx);
    }
  } catch(e) {}
}
function getSessionIndex(coId) {
  return LS.get("sesidx_" + coId) || [];
}

// Hoá đơn dùng chung cho cả công ty — lưu MỘT lần thay vì nhân bản theo từng tài khoản
function saveCoInvoices(coId, invDV, invDR) {
  try {
    if ((invDV && invDV.length) || (invDR && invDR.length)) {
      LS.set("inv_" + coId, { invDV: invDV || [], invDR: invDR || [] });
    }
  } catch(e) {}
}
function getCoInvoices(coId) {
  const v = LS.get("inv_" + coId);
  return v || { invDV: [], invDR: [] };
}

// Danh sách Tờ khai Hải quan (NK hoặc XK) dùng chung cho cả công ty (không theo từng tài khoản NH)
// — dùng để gợi ý/gắn vào giao dịch thanh toán ngoại tệ khi đối chiếu sao kê. NK và XK lưu ở 2 key
// riêng (tokhai_ vs tokhaixk_) để không lẫn lộn dữ liệu.
function saveCoToKhai(coId, list, kind) {
  try { LS.set((kind === "XK" ? "tokhaixk_" : "tokhai_") + coId, list || []); } catch (e) {}
}
function getCoToKhai(coId, kind) {
  return LS.get((kind === "XK" ? "tokhaixk_" : "tokhai_") + coId) || [];
}

// Ước lượng dung lượng localStorage đang dùng (KB)
function storageUsedKB() {
  try {
    let total = 0;
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      const v = localStorage.getItem(k) || "";
      total += k.length + v.length;
    }
    return Math.round(total / 1024);
  } catch(e) { return 0; }
}
// Dọn dữ liệu mồ côi: inv_/sesidx_/session_ của công ty không còn tồn tại
function cleanupOrphanStorage() {
  try {
    const cos = LS.get("companies") || [];
    const validIds = new Set(cos.map(c => c.id));
    const toDel = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (!k) continue;
      let coId = null;
      if (k.startsWith("inv_")) coId = k.slice(4);
      else if (k.startsWith("sesidx_")) coId = k.slice(7);
      else if (k.startsWith("inputdata_")) coId = k.slice(10);
      else if (k.startsWith("dict_") && k !== "dict_global") coId = k.slice(5);
      else if (k.startsWith("session_")) { const rest = k.slice(8); coId = rest.split("_")[0]; }
      if (coId && !validIds.has(coId)) toDel.push(k);
    }
    toDel.forEach(k => { try { localStorage.removeItem(k); } catch(e) {} });
    return toDel.length;
  } catch(e) { return 0; }
}

// ── Helpers ───────────────────────────────────────────────────────────────────
function uid() {
  return Date.now() + Math.random().toString(36).slice(2, 6);
}
function fmt(n, currency) {
  if (!n && n !== 0) return "—";
  if(currency==="USD") return "$"+(Math.round(n*100)/100).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
  return Number(n).toLocaleString("vi-VN") + "đ";
}
// Đọc file Excel: SheetJS format ngày kiểu "raw:false" theo định dạng mặc định của máy/trình duyệt
// (thường ra M/D/YY kiểu Mỹ) chứ không phải DD/MM/YYYY Việt Nam — khiến ngày bị đảo (VD 27/10/2025
// hiển thành "10/27/25"). Đọc raw (giữ nguyên Date object) rồi tự format DD/MM/YYYY để luôn đúng.
function xlsxCellToText(c) {
  if (c instanceof Date && !isNaN(c)) {
    // Dùng getUTC* vì SheetJS mã hoá ngày trong Excel là mốc UTC nửa đêm — dùng getDate() theo giờ
    // máy sẽ bị lệch 1 ngày ở các múi giờ âm so với UTC.
    const dd = String(c.getUTCDate()).padStart(2, "0");
    const mm = String(c.getUTCMonth() + 1).padStart(2, "0");
    return `${dd}/${mm}/${c.getUTCFullYear()}`;
  }
  return c === null || c === undefined ? "" : String(c);
}
function normVN(s) {
  return String(s || "").toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[đĐ]/g, "D").replace(/[^A-Z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
}
const STOP = new Set(["CONG", "CTY", "TNHH", "MTV", "CO", "PHAN", "CP", "SAN", "XUAT", "THUONG", "MAI", "DICH", "VU", "XAY", "DUNG", "HOA", "DON", "THANH", "TOAN", "HANG", "TIEN", "NGAY", "NGAN", "HANG", "GD", "HD", "IB", "TT", "LA", "LO", "PHAT", "THE", "FOR", "AND", "PAY", "TAM", "MUT", "MUA", "VAN", "CHUYEN", "TRA", "QUA", "THEO", "NOP", "CHI", "NOI", "THAT", "VIET", "NAM", "PHAN", "MUC"]);
function scoreKw(kw, desc, ownWords) {
  const nd = normVN(desc),
    nk = normVN(kw);
  // Từ khoá quá ngắn (VD "CT", "GD", "TT") hoặc chỉ gồm toàn các từ viết tắt loại hình DN/thuật ngữ
  // ngân hàng chung chung (không có từ nào đủ đặc trưng) rất dễ khớp bừa với gần như MỌI giao dịch
  // (VD "CTY" xuất hiện trong hầu hết nội dung sao kê) — chặn hẳn các từ khoá kiểu này ngay từ đầu.
  // ownWords (nếu có): các từ trong TÊN CÔNG TY CHỦ TÀI KHOẢN — bản thân sao kê ngân hàng luôn lặp
  // lại tên chủ tài khoản trong hầu hết mọi giao dịch (là người gửi/nhận), nên 1 từ khoá chỉ trùng
  // tên công ty mình cũng không có giá trị phân biệt, dễ khớp bừa y hệt các từ viết tắt chung chung.
  if (!nk || nk.length < 3) return 0;
  const nkWords = nk.split(" ");
  const hasSpecificWord = nkWords.some(w => w.length >= 3 && !STOP.has(w) && !(ownWords && ownWords.has(w)));
  if (!hasSpecificWord) return 0;
  if (nd.includes(nk)) return 1.0;
  const words = nk.split(" ").filter(w => w.length >= 3);
  if (!words.length) return 0;
  const ndTokens = nd.split(" ");
  const wordMatches = w => {
    // Mảnh số thuần (VD "1701" tách ra từ từ khoá "TM:1701") chỉ được tính khớp khi nó
    // là MỘT CỤM SỐ RIÊNG BIỆT trong nội dung giao dịch — không cho khớp kiểu "substring"
    // tự do, vì rất dễ trùng ngẫu nhiên với một đoạn con bên trong mã tham chiếu ngân hàng
    // dài (VD "19024052417012" chứa "1701" ở giữa nhưng không liên quan gì tới từ khoá).
    if (/^[0-9]+$/.test(w)) return ndTokens.includes(w);
    return nd.includes(w);
  };
  return words.filter(wordMatches).length / words.length;
}
function extractKw(desc) {
  const words = normVN(desc).split(" ").filter(w => w.length >= 3 && !STOP.has(w) && !/^\d+$/.test(w));
  return words.slice(0, 4).join(" ");
}

// Parse pasted/uploaded table — nhận biết ô có dấu ngoặc kép kiểu Excel/CSV (VD ô "Nội dung"
// bị Excel tự chèn xuống dòng bên trong: `...\t"dòng 1\ndòng 2"\t...`). Nếu tách dòng ngây thơ
// theo "\n" như trước, 1 giao dịch có ô nội dung xuống dòng sẽ bị GÃY thành 2 dòng dữ liệu sai
// lệch cột, làm mất số tiền. Ở đây coi dấu "\n"/"\t" bên trong cặp ngoặc kép là ký tự thường.
function parseTable(text) {
  if (!text.trim()) return [];
  const s = text.replace(/\r\n/g, "\n");
  const rows = [];
  let row = [], field = "", inQuotes = false;
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (inQuotes) {
      if (ch === '"') {
        if (s[i + 1] === '"') { field += '"'; i++; }
        else inQuotes = false;
      } else if (ch === "\n" || ch === "\r") {
        field += " "; // xuống dòng bên trong ô → gộp lại thành 1 dòng, tránh gãy giao dịch
      } else {
        field += ch;
      }
    } else if (ch === '"' && field === "") {
      inQuotes = true;
    } else if (ch === "\t") {
      row.push(field); field = "";
    } else if (ch === "\n") {
      row.push(field); field = "";
      if (row.some(c => c.trim())) rows.push(row);
      row = [];
    } else {
      field += ch;
    }
  }
  row.push(field);
  if (row.some(c => c.trim())) rows.push(row);
  return rows.map(r => r.map(c => c.trim()));
}
function parseSaoke(text, currency) {
  const isUSD = (currency||"VND")==="USD";
  const rows = parseTable(text);
  if (!rows.length) return [];

  // ── Detect header row ──────────────────────────────────────────────────────
  // Bắt buộc ô ngắn (< 25 ký tự, giống các cột dbI/crI bên dưới) khi tìm "NGAY"/"NOI DUNG" — nếu
  // không, một GIAO DỊCH THẬT (không phải dòng tiêu đề) có nội dung dài chứa chữ "NGAY" (VD "...
  // INVOICE NGAY 11.06.2016...") sẽ bị nhận nhầm là dòng tiêu đề và bị loại bỏ toàn bộ ngay từ dòng
  // đầu tiên, làm mất đúng giao dịch đó khi xử lý.
  const h = rows[0].map(c => normVN(c));
  const dI  = h.findIndex(c => c.length < 25 && (c.includes("NGAY") || c === "DATE"));
  const nI  = h.findIndex(c => c.length < 25 && (c.includes("NOI DUNG") || c.includes("DIEN GIAI") || c.includes("CONTENT") || c.includes("MO TA") || c.includes("GIAO DICH")));
  // Note: "CO" and "NO" are too short — match descriptions like "DAT COC", "CONG TY"
  // Use more specific patterns. Also require short cell (< 40 chars) to avoid matching descriptions
  const dbI = h.findIndex(c => c.length < 40 && (
    c.includes("GHI NO") || c.includes("TIEN RA") || c.includes("SO NO") || c.includes("TIEN NO") || c.includes("DEBIT") ||
    c.includes("RUT RA") || c.includes("RUT TIEN") ||
    c === "NO" || c === "RUT" || c === "CHI TIET" || c.includes("PHAT SINH NO")
  ));
  const crI = h.findIndex(c => c.length < 40 && (
    c.includes("GHI CO") || c.includes("TIEN VAO") || c.includes("SO CO") || c.includes("TIEN CO") || c.includes("CREDIT") ||
    c === "CO" || c.includes("GUI VAO") || c.includes("PHAT SINH CO") || c.includes("NHAN")
  ));

  // Số âm luôn trả về 0 (parseNum không có khái niệm "âm"). Nếu cần giữ dấu
  // (VD cột số tiền có dấu ±), phải tự strip dấu và xử lý ở nơi gọi TRƯỚC khi
  // gọi hàm này — xem ví dụ signedCandidates trong parseSaoke().
  if (isNaN(n) || n < 0) return 0;
  const res = usd ? Math.round(n * 100) / 100 : Math.round(n);
  if (!usd && res > 9999000000000) return 0;
  if (usd && res > 999000000) return 0;
  return res;
}

function sanitizeRow(r){const M=9999000000000,MU=999000000,isU=r.tx&&r.tx.currency==="USD";if(!r.tx)return r;const d=(!isU?r.tx.debit<=M:r.tx.debit<=MU)?r.tx.debit:0,cr=(!isU?r.tx.credit<=M:r.tx.credit<=MU)?r.tx.credit:0;return(d===r.tx.debit&&cr===r.tx.credit)?r:{...r,tx:{...r.tx,debit:d,credit:cr}};}
function sanitizeRows(rows){return rows.map(sanitizeRow);}

// Giảm dung lượng lưu: bỏ các mảng gợi ý nặng (có thể tính lại) khỏi dòng ĐÃ xác nhận
function slimRow(r){
  if(!r||!r.tx) return r;
  if(r.confirmed==="yes"||r.confirmed==="no"){
    const {invMatches,nameMatches,t2_nameAmt,t1_dict,...rest}=r;
    return rest; // dòng đã xử lý: bỏ gợi ý (không cần nữa)
  }
  // dòng chờ: giữ gợi ý nhưng giới hạn 5 để tiết kiệm
  const out={...r};
  if(Array.isArray(out.invMatches)&&out.invMatches.length>5) out.invMatches=out.invMatches.slice(0,5);
  if(Array.isArray(out.nameMatches)&&out.nameMatches.length>5) out.nameMatches=out.nameMatches.slice(0,5);
  return out;
}
function slimRows(rows){return (rows||[]).map(slimRow);}
// Slim mạnh: bỏ TẤT CẢ gợi ý (dùng khi bộ nhớ đầy) — chỉ giữ tx + dữ liệu xác nhận
function slimRowsHard(rows){return (rows||[]).map(r=>{ if(!r||!r.tx)return r; const {invMatches,nameMatches,t2_nameAmt,t1_dict,...rest}=r; return rest; });}
// ── Auto-fix rows with wrong amounts (zero, tiny, or ÷1000 bug) ──────────────
function autoFixZeroAmounts(rows, rawSaoke, currency) {
  if (!rawSaoke || !rawSaoke.trim() || !rows || !rows.length) return rows;
  const isVND = (currency||"VND") !== "USD";

  // Re-parse the raw sao ke text using the FIXED parseNum
  const reparsed = parseSaoke(rawSaoke, currency||"VND");
  if (!reparsed || !reparsed.length) return rows;

  // Build lookup: date+desc → reparsed row
  const lookup = {};
  reparsed.forEach(r => {
    const k = (r.date||"") + (r.desc||"").trim().slice(0, 60);
    lookup[k] = r;
  });

  // Detect ÷1000 bug: stored amount * 1000 ≈ reparsed amount
  let div1000Count = 0, comparable = 0;
  rows.forEach(row => {
    if (!row.tx) return;
    const stored = Math.max(row.tx.debit||0, row.tx.credit||0);
    if (stored < 100) return; // skip tiny/zero (handled separately)
    const k = (row.tx.date||"") + (row.tx.desc||"").trim().slice(0, 60);
    const m = lookup[k];
    if (!m) return;
    const fresh = Math.max(m.debit||0, m.credit||0);
    comparable++;
    if (fresh > 0 && stored > 0 && Math.abs(fresh / stored - 1000) < 10) div1000Count++;
  });
  // Sao kê ngắn (1-2 dòng so sánh được): yêu cầu TẤT CẢ đều lộ lỗi ÷1000 để tránh báo nhầm.
  // Sao kê đủ dài (≥3 dòng): chỉ cần ≥10% số dòng lộ lỗi là đủ tin cậy.
  const hasDiv1000Bug = comparable > 0 && (comparable >= 3 ? (div1000Count / comparable) >= 0.10 : div1000Count === comparable);

  // Also detect zero/tiny amounts
  const hasTinyBug = rows.some(r => {
    if (!r.tx) return false;
    const amt = Math.max(r.tx.debit||0, r.tx.credit||0);
    return amt === 0 || (isVND && amt > 0 && amt < 100);
  });

  if (!hasDiv1000Bug && !hasTinyBug) return rows;

  return rows.map(row => {
    if (!row.tx) return row;
    const stored = Math.max(row.tx.debit||0, row.tx.credit||0);
    const k = (row.tx.date||"") + (row.tx.desc||"").trim().slice(0, 60);
    const m = lookup[k];
    if (!m || (m.debit===0 && m.credit===0)) return row;
    const fresh = Math.max(m.debit||0, m.credit||0);

    const isTiny = stored === 0 || (isVND && stored > 0 && stored < 100);
    const isDiv1000 = hasDiv1000Bug && fresh > 0 && stored > 0 && Math.abs(fresh / stored - 1000) < 10;

    if (!isTiny && !isDiv1000) return row;
    return {...row, tx: {...row.tx, debit: m.debit, credit: m.credit}};
  });
}

// ── AI Matching ───────────────────────────────────────────────────────────────
async function runMatching(saoke, invDV, invDR, coDict, globalDict, apiKey, onProgress, coName) {
  const invDVm = invDV.map(i => ({...i,loai: "DAUVAO"}));
  const invDRm = invDR.map(i => ({...i,loai: "DAURA"}));
  function getPool(tx) {
    return tx.credit > 0 ? invDRm : invDVm;
  }
  function getAmt(tx) {
    return Math.max(tx.debit || 0, tx.credit || 0);
  }
  const results = [];
  // Tên chủ tài khoản luôn lặp lại trong hầu hết mọi giao dịch (là người gửi/nhận trên sao kê) —
  // loại các từ này khỏi việc tính "đặc trưng" của từ khoá để tránh khớp bừa (xem scoreKw()).
  const ownWords = new Set(normVN(coName || "").split(" ").filter(w => w.length >= 3));

  // ── Tầng 1: Từ điển keyword ──
  onProgress("Tầng 1/2: Đối chiếu từ điển keyword...");
  for (const tx of saoke) {
    let best = null,
      bs = 0;
    for (const d of [...coDict, ...globalDict]) {
      const s = scoreKw(d.keyword, tx.desc, ownWords);
      if (s > bs) {
        bs = s;
        best = {
          ...d,
          score: s
        };
      }
    }
    const t1 = bs === 1 ? best : null; // Chỉ khớp ĐÚNG 100% keyword, không dùng fuzzy
    // Không tự động xác nhận nữa — kể cả khớp 100% từ điển cũng chỉ hiện gợi ý (t1_dict), người dùng
    // phải tự bấm "✓ Đúng" để xác nhận. Tránh trường hợp từ khoá học nhầm khiến hạch toán tự động
    // sai công ty mà người dùng không để ý (VD nội dung "CTY CHÂU BẢO HOÀNG" bị gán nhầm cho 1 công
    // ty hoàn toàn khác trong từ điển).
    const autoConfirm = {
      confirmed: null,
      confirmedMST: null,
      confirmedName: null,
      confirmedLoai: null,
      confirmedHach: null
    };
    results.push({
      id: uid(),
      tx: {...tx, rawAmt: tx.rawAmt||""},
      t1_dict: t1,
      t2_nameAmt: null,
      invMatches: [],
      ...autoConfirm
    });
  }

  // ── Tầng 2: Khớp số tiền trong pool đúng loại — CHỈ GỢI Ý, không tự xác nhận ──
  // Chạy cho TẤT CẢ dòng, kể cả dòng đã có t1_dict — vì từ điển có thể khớp NHẦM công ty (keyword
  // học sai), nên vẫn cần các gợi ý số tiền/tên để người dùng đối chiếu và tự chọn đúng.
  onProgress("Tầng 2/3: Khớp số tiền với hoá đơn...");
  for (const r of results) {
    const pool = getPool(r.tx);
    const amt = getAmt(r.tx);
    if (!amt || amt < 100) continue;

    // Parse transaction date for proximity sorting (dd/mm/yyyy)
    function parseDDMMYYYY(s) {
      if (!s) return 0;
      const valid = (dd, mm, yy) => mm >= 1 && mm <= 12 && dd >= 1 && dd <= 31 && yy > 0;
      const build = (dd, mm, yy) => {
        const y4 = yy < 100 ? 2000 + yy : yy; // 2-digit year → 20xx
        const dt = new Date(y4, mm - 1, dd);
        // Reject dates JS silently "rolled over" (e.g. 31/04 → 01/05)
        if (dt.getFullYear() !== y4 || dt.getMonth() !== mm - 1 || dt.getDate() !== dd) return 0;
        return dt.getTime();
      };
      const p = String(s).trim().split(/[\/\-\.]/);
      if (p.length === 3) {
        // Try dd/mm/yyyy first
        const d = parseInt(p[0]),
          m = parseInt(p[1]),
          y = parseInt(p[2]);
        if (y > 100 && valid(d, m, y)) return build(d, m, y);
        // Try yyyy/mm/dd
        const y2 = parseInt(p[0]),
          m2 = parseInt(p[1]),
          d2 = parseInt(p[2]);
        if (y2 > 100 && valid(d2, m2, y2)) return build(d2, m2, y2);
        // 2-digit year variants: dd/mm/yy and yy/mm/dd
        if (y <= 100 && valid(d, m, y)) return build(d, m, y);
        if (y2 <= 100 && valid(d2, m2, y2)) return build(d2, m2, y2);
      }
      return 0;
    }
    const txTime = parseDDMMYYYY(r.tx.date);

    // Filter: amount within 2% OR exact match
    const amtHits = pool.filter(i => {
      const t = i.tong || 0;
      if (t < 100) return false;
      const diff = Math.abs(t - amt);
      // Exact match
      if (diff === 0) return true;
      // Within 2%
      return diff / amt <= 0.02;
    });
    if (!amtHits.length) continue;

    // Sort: exact match first, then closest date to transaction
    amtHits.sort((a, b) => {
      const diffA = Math.abs((a.tong || 0) - amt);
      const diffB = Math.abs((b.tong || 0) - amt);
      if (diffA === 0 && diffB !== 0) return -1;
      if (diffB === 0 && diffA !== 0) return 1;
      // Closest date to tx date
      if (txTime > 0) {
        const dtA = Math.abs(parseDDMMYYYY(a.ngay) - txTime);
        const dtB = Math.abs(parseDDMMYYYY(b.ngay) - txTime);
        if (dtA !== dtB) return dtA - dtB;
      }
      return diffA - diffB;
    });

    // Deduplicate: same MST + same amount → keep only the closest date
    // But keep different amounts from same MST (partial payments)
    const seen = new Set();
    const deduped = amtHits.filter(i => {
      const key = (i.mst || i.ten_cty || i.id) + "_" + Math.round(i.tong || 0);
      if (seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    r.t2_nameAmt = deduped[0];
    r.invMatches = deduped.slice(0, 4);
  }

  // ── Tầng 3: Gợi ý khớp tên công ty (fuzzy ≥50%, không trùng MST) ──
  onProgress("Tầng 3/3: Dò tên công ty gần khớp...");
  for (const r of results) {
    const pool = getPool(r.tx);
    const descN = normVN(r.tx.desc);
    const SKIP = new Set(["THANH", "TOAN", "HANG", "TIEN", "NGAY", "CTY", "TNHH", "MTV", "CONG", "CO", "PHAN", "CP", "SAN", "XUAT", "THUONG", "MAI", "DICH", "VU", "IB", "GD", "HD", "TT",
      // Các từ đầy đủ tương ứng với chữ viết tắt loại hình DN ở trên (VD hoá đơn ghi "TRÁCH NHIỆM HỮU HẠN"
      // nhưng sao kê ngân hàng ghi tắt "TNHH") — bỏ qua cả 2 dạng để không làm loãng điểm khớp tên.
      "TRACH", "NHIEM", "HUU", "HAN", "MOT", "VIEN", "DOANH", "NGHIEP"]);
    const descWords = descN.split(" ").filter(w => w.length >= 3 && !SKIP.has(w));
    if (!descWords.length) continue;
    const seenMST = new Set(); // dedup by MST
    // Tính điểm khớp rồi SẮP XẾP theo điểm giảm dần trước khi cắt lấy 5 — trước đây filter() giữ
    // nguyên thứ tự trong pool, nên 1 công ty khớp ĐÚNG 100% có thể bị loại khỏi top 5 chỉ vì nó
    // nằm sau các công ty khớp yếu hơn (chỉ trùng vài từ chung như "XÂY DỰNG") trong danh sách hoá đơn.
    const nameMatches = pool.map(i => {
      if (!i.ten_cty) return null;
      const tnWords = normVN(i.ten_cty).split(" ").filter(w => w.length >= 3 && !SKIP.has(w));
      if (!tnWords.length) return null;
      const hits = tnWords.filter(w => descWords.includes(w)).length;
      const score = hits / tnWords.length;
      return score >= 0.5 ? { inv: i, score } : null; // require at least 50% of company name words to match
    }).filter(Boolean).sort((a, b) => b.score - a.score).filter(x => {
      const key = x.inv.mst || x.inv.ten_cty; // deduplicate by MST
      if (seenMST.has(key)) return false;
      seenMST.add(key);
      return true;
    }).slice(0, 5).map(x => x.inv);
    if (nameMatches.length) r.nameMatches = nameMatches;
  }
  await new Promise(r => setTimeout(r, 100));
  return results;
}

// Dò lại gợi ý (Tầng 2 + Tầng 3) cho các dòng CHƯA khớp bằng danh sách hoá đơn HIỆN TẠI.
// Cần thiết vì gợi ý (t2_nameAmt/invMatches/nameMatches) chỉ được tính 1 lần lúc dán sao kê —
// nếu hoá đơn được bổ sung SAU đó, các dòng cũ sẽ không tự có gợi ý mới cho tới khi dò lại.
function rematchPending(rows, invDV, invDR, coDict, globalDict, coName) {
  const invDVm = (invDV||[]).map(i => ({...i, loai: "DAUVAO"}));
  const invDRm = (invDR||[]).map(i => ({...i, loai: "DAURA"}));
  const getPool = tx => (tx.credit > 0 ? invDRm : invDVm);
  const getAmt = tx => Math.max(tx.debit || 0, tx.credit || 0);
  const SKIP = new Set(["THANH", "TOAN", "HANG", "TIEN", "NGAY", "CTY", "TNHH", "MTV", "CONG", "CO", "PHAN", "CP", "SAN", "XUAT", "THUONG", "MAI", "DICH", "VU", "IB", "GD", "HD", "TT",
      // Các từ đầy đủ tương ứng với chữ viết tắt loại hình DN ở trên (VD hoá đơn ghi "TRÁCH NHIỆM HỮU HẠN"
      // nhưng sao kê ngân hàng ghi tắt "TNHH") — bỏ qua cả 2 dạng để không làm loãng điểm khớp tên.
      "TRACH", "NHIEM", "HUU", "HAN", "MOT", "VIEN", "DOANH", "NGHIEP"]);
  const ownWords = new Set(normVN(coName || "").split(" ").filter(w => w.length >= 3));
  const allDict = [...(coDict||[]), ...(globalDict||[])];
  return rows.map(r => {
    if (r.confirmed === "yes") return r;
    // Dò lại Tầng 1 (từ điển) bằng scoreKw đã sửa (chặn từ khoá chung chung/trùng tên chủ TK) — để
    // các dòng đã có t1_dict SAI từ lần xử lý cũ (trước khi có bản vá) cũng được tự sửa lại, không
    // cần dán lại sao kê.
    let bs = 0, best = null;
    for (const d of allDict) {
      const s = scoreKw(d.keyword, r.tx.desc, ownWords);
      if (s > bs) { bs = s; best = { ...d, score: s }; }
    }
    const t1_dict = bs === 1 ? best : null;
    const pool = getPool(r.tx);
    const amt = getAmt(r.tx);
    let t2_nameAmt = null, invMatches = [];
    if (amt >= 100) {
      const amtHits = pool.filter(i => { const t = i.tong || 0; if (t < 100) return false; const diff = Math.abs(t - amt); return diff === 0 || diff / amt <= 0.02; });
      amtHits.sort((a, b) => { const diffA = Math.abs((a.tong||0) - amt), diffB = Math.abs((b.tong||0) - amt); return diffA - diffB; });
      const seen = new Set();
      const deduped = amtHits.filter(i => { const key = (i.mst || i.ten_cty || i.id) + "_" + Math.round(i.tong || 0); if (seen.has(key)) return false; seen.add(key); return true; });
      t2_nameAmt = deduped[0] || null;
      invMatches = deduped.slice(0, 4);
    }
    const descN = normVN(r.tx.desc);
    const descWords = descN.split(" ").filter(w => w.length >= 3 && !SKIP.has(w));
    let nameMatches = [];
    if (descWords.length) {
      const seenMST = new Set();
      // Sắp xếp theo điểm khớp giảm dần trước khi cắt lấy 5 (xem giải thích trong runMatching).
      nameMatches = pool.map(i => {
        if (!i.ten_cty) return null;
        const tnWords = normVN(i.ten_cty).split(" ").filter(w => w.length >= 3 && !SKIP.has(w));
        if (!tnWords.length) return null;
        const score = tnWords.filter(w => descWords.includes(w)).length / tnWords.length;
        return score >= 0.5 ? { inv: i, score } : null;
      }).filter(Boolean).sort((a, b) => b.score - a.score).filter(x => {
        const key = x.inv.mst || x.inv.ten_cty;
        if (seenMST.has(key)) return false;
        seenMST.add(key);
        return true;
      }).slice(0, 5).map(x => x.inv);
    }
    return { ...r, t1_dict, t2_nameAmt, invMatches, nameMatches };
  });
}
async function learnFromResults(results, coDict, coId) {
  // Only learn from manually confirmed (not auto-confirmed 100%)
  // We only save entries that user explicitly clicked "Đúng" on non-100% matches
  let d = [...coDict];
  let changed = false;
  for (const r of results) {
    if (r.confirmed !== "yes" || !r.confirmedMST || !r.manualConfirm) continue;
    const kw = r.manualKw || r.t1_dict && r.t1_dict.keyword || "";
    if (!kw || kw.length < 3) continue;
    const key = normVN(kw);
    const ex = d.find(x => normVN(x.keyword) === key && x.mst === r.confirmedMST);
    if (!ex) {
      d.push({
        id: uid(),
        keyword: kw,
        mst: r.confirmedMST,
        ten_cty: r.confirmedName || "",
        hach_toan: r.confirmedHach || "",
        note: "AI học",
        hits: 1,
        source: "learned",
        created: new Date().toLocaleDateString("vi-VN")
      });
      changed = true;
    } else {
      ex.hits = (ex.hits || 0) + 1;
      // Update hach_toan if we now have one and didn't before
      if (!ex.hach_toan && r.confirmedHach) ex.hach_toan = r.confirmedHach;
      changed = true;
    }
  }
  if (changed) LS.set("dict_" + coId, d);
  return d;
}

function exportExcel(results, coName, allDict) {

    results.forEach(r => {

      }
      data.push([stt++, r.tx.date, r.tx.desc, r.tx.debit || 0, r.tx.credit || 0, hach, r.confirmedMST || "", r.confirmedName || "", status]);
    });
    const ws = XLSX.utils.aoa_to_sheet(data);

    // (VD lọc theo Hạch toán = "X", theo Trạng thái, theo MST...).
    ws["!autofilter"] = { ref: "A4:I" + data.length };

// ── Export UNT / UNC cho MISA (mẫu Import chứng từ thu tiền / chi tiền gửi) ──
// Số chứng từ tự sinh: PREFIX + vài số cuối của TK ngân hàng + ngày chứng từ (bỏ dấu "/") + số thứ
// tự tăng dần. Bắt buộc phải có phần TK ngân hàng — nếu công ty có NHIỀU tài khoản và xuất UNT/UNC
// riêng cho từng TK, chỉ dùng ngày+số thứ tự thì các lần xuất khác nhau rất dễ trùng số chứng từ
// (VD "UNT17/05/202410" của VietinBank trùng với "UNT17/05/202410" của ACB) khiến MISA báo trùng khi
// import nhiều TK cùng lúc. Luôn giữ tối đa 20 ký tự theo giới hạn của MISA.
function buildVoucherNo(prefix, date, seq, bankAcct, accountNo) {
  // Ngày trong sao kê có thể dùng "/" hoặc "-" tuỳ ngân hàng (VD "27/12/2025" hoặc "31-08-2023") —
  // trước đây chỉ xoá "/" nên ngày dạng "-" vẫn giữ nguyên 10 ký tự, chiếm gần hết 20 ký tự cho phép
  // của số chứng từ. Rút gọn về "ddmmyy" (6 số, bỏ chỉ giữ 2 số cuối của năm) để luôn còn đủ chỗ cho
  // số thứ tự giao dịch (seq) — thiếu chỗ khiến chuỗi bị cắt bớt (.slice) và 2 giao dịch khác nhau
  // (chỉ khác ở phần đuôi bị cắt mất) vô tình trùng số chứng từ, khiến MISA gộp nhầm khi import.
  const dDigits = String(date || "").replace(/\D/g, "");
  const compactDate = dDigits.length >= 8 ? dDigits.slice(0, 4) + dDigits.slice(6, 8) : dDigits;
  // Ưu tiên băm theo SỐ TÀI KHOẢN NGÂN HÀNG THẬT (accountNo) để phân biệt các tài khoản — số tài
  // khoản ngân hàng luôn là duy nhất trên thực tế, không như mã hạch toán MISA (bankAcct) là text
  // người dùng tự gõ nên dễ trùng phần đuôi số giữa các tài khoản khác nhau (VD "1121" và
  // "1121-VCB" cùng kết thúc "1121") → khiến 2 tài khoản khác nhau bị gán cùng 1 mã, dẫn tới trùng
  // số chứng từ. Băm cả chuỗi (không chỉ lấy vài số cuối) để giảm tối đa khả năng trùng.
  const seed = String(accountNo || bankAcct || "");
  let h = 0;
  for (let i = 0; i < seed.length; i++) h = (h * 31 + seed.charCodeAt(i)) >>> 0;
  const tag = String(h % 100000).padStart(5, "0");
  // Không còn giới hạn cứng 20 ký tự — với format rút gọn ở trên, chiều dài thực tế chỉ khoảng
  // 3+5+6+độ dài(seq) nên gần như không bao giờ cần cắt; chỉ chặn ở mức rất cao để đề phòng seq
  // bất thường quá dài, tránh lặp lại lỗi cắt mất phần cuối như trước.
  return `${prefix}${tag}${compactDate}${seq}`.slice(0, 30);
}

// ── Tỷ giá Vietcombank theo ngày (dùng để quy đổi USD → VND khi xuất UNT/UNC) ──────────────────
// Vietcombank không công bố tỷ giá vào cuối tuần/ngày lễ → nếu không có dữ liệu đúng ngày, lùi dần
// tối đa 7 ngày trước đó để lấy tỷ giá gần nhất (đúng thông lệ kế toán khi ngày giao dịch rơi vào
// ngày nghỉ). Đọc JSON linh hoạt theo nhiều tên trường có thể có vì API công khai của Vietcombank
// không có tài liệu chính thức.
const vcbRateCache = {};
function toIsoDate(dateVN) {
  const m = String(dateVN || "").match(/(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{4})/);
  if (!m) return null;
  return `${m[3]}-${m[2].padStart(2, "0")}-${m[1].padStart(2, "0")}`;
}
function shiftIsoDate(iso, days) {
  const d = new Date(iso + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}
async function fetchVCBRateForIso(iso) {
  if (vcbRateCache[iso] !== undefined) return vcbRateCache[iso];
  try {
    const res = await fetch(`https://www.vietcombank.com.vn/api/exchangerates?date=${iso}`, { headers: { "Accept": "application/json" } });
    if (!res.ok) { vcbRateCache[iso] = null; return null; }
    const json = await res.json();
    const list = json.Data || json.data || json.results || json.Results || [];
    const num = v => { const n = parseFloat(String(v == null ? "" : v).replace(/,/g, "")); return isNaN(n) ? 0 : n; };
    const item = list.find(x => {
      const code = String(x.currencyCode || x.CurrencyCode || x.currency || x.Currency || "").toUpperCase();
      return code === "USD";
    });
    if (!item) { vcbRateCache[iso] = null; return null; }
    const buy = num(item.buy ?? item.Buy ?? item.buyTransfer ?? item.BuyTransfer ?? item.buy_transfer ?? item.transfer ?? item.Transfer ?? item.cash ?? item.Cash);
    const sell = num(item.sell ?? item.Sell ?? item.sellTransfer ?? item.SellTransfer ?? item.sell_transfer);
    const rate = (buy > 0 && sell > 0) ? { buy, sell } : null;
    vcbRateCache[iso] = rate;
    return rate;
  } catch (e) {
    vcbRateCache[iso] = null;
    return null;
  }
}
// Lấy tỷ giá tại ngày giao dịch (dd/mm/yyyy) — lùi tối đa 7 ngày nếu không có (cuối tuần/lễ).
async function fetchVCBRate(dateVN) {
  const iso0 = toIsoDate(dateVN);
  if (!iso0) return null;
  for (let back = 0; back <= 7; back++) {
    const iso = shiftIsoDate(iso0, -back);
    const rate = await fetchVCBRateForIso(iso);
    if (rate) return rate;
  }
  return null;
}
// Quy đổi USD → VND cho toàn bộ các dòng USD trong danh sách, dùng tỷ giá BÁN RA cho tiền ra (chi
// tiền thanh toán) và tỷ giá MUA VÀO cho tiền vào (thu tiền) — theo thông lệ phổ biến khi không có
// tỷ giá ghi sổ riêng theo phương pháp bình quân gia quyền/NT-XT. Trả về Map id→số tiền VND đã quy
// đổi, và mảng các dòng KHÔNG lấy được tỷ giá (cần bổ sung tỷ giá thủ công) để cảnh báo.
async function convertUsdRowsToVnd(usdRows) {
  const vndOf = new Map();
  const failed = [];
  for (const r of usdRows) {
    const rate = await fetchVCBRate(r.tx.date);
    const amt = r.tx.debit || r.tx.credit || 0;
    if (!rate) { failed.push(r); continue; }
    const usedRate = r.tx.debit > 0 ? rate.sell : rate.buy;
    vndOf.set(r.id, Math.round(amt * usedRate));
  }
  return { vndOf, failed };
}

async function exportUNT(rows, coName, bankAcct, accountNo, bankName, showToast, tokhaiList) {
  try {
    // Dòng bên kia của 1 giao dịch chuyển khoản nội bộ (hạch toán = "X") chỉ là placeholder tự động
    // đánh dấu — bên đã bấm xác nhận nội bộ đã hạch toán đủ cả 2 vế bằng mã TK thật rồi, đưa dòng "X"
    // này vào UNT sẽ ghi trùng 1 lần nữa nên phải loại bỏ.
    const confirmedIn = rows.filter(r => r.confirmed === "yes" && (r.tx.credit || 0) > 0 && r.confirmedHach !== "X");
    if (!confirmedIn.length) { alert("Không có giao dịch tiền vào đã xác nhận để xuất UNT."); return; }
    // TK ngoại tệ (USD): sổ sách MISA ghi bằng VND, nên phải tự lấy tỷ giá Vietcombank tại đúng ngày
    // giao dịch để quy đổi — không thể xuất thẳng số tiền USD vào cột "Số tiền" (vốn phải là VND).
    const usdRows = confirmedIn.filter(r => r.tx.currency === "USD");
    let vndOf = new Map(), fxFailed = [];
    // Ưu tiên tỷ giá NGƯỜI DÙNG ĐÃ TỰ NHẬP/SỬA trên từng dòng (r.tyGia) — chỉ tự động gọi API lấy
    // tỷ giá cho các dòng CHƯA có tỷ giá, để tránh gọi mạng không cần thiết và tôn trọng tỷ giá thực
    // tế người dùng đã xác nhận theo chứng từ.
    const usdManual = usdRows.filter(r => r.tyGia > 0);
    const usdNeedFetch = usdRows.filter(r => !(r.tyGia > 0));
    usdManual.forEach(r => vndOf.set(r.id, Math.round((r.tx.debit || r.tx.credit || 0) * r.tyGia)));
    if (usdNeedFetch.length) {
      if (showToast) showToast(`Đang lấy tỷ giá Vietcombank cho ${usdNeedFetch.length} giao dịch USD...`, "ok");
      const conv = await convertUsdRowsToVnd(usdNeedFetch);
      conv.vndOf.forEach((v, k) => vndOf.set(k, v));
      fxFailed = conv.failed;
    }
    const header = ["Hiển thị trên sổ", "Ngày hạch toán (*)", "Ngày chứng từ (*)", "Số chứng từ (*)", "Mã đối tượng", "Tên đối tượng", "Địa chỉ", "Nộp vào TK", "Mở tại NH", "Lý do thu", "Diễn giải lý do thu ", "Nhân viên thu", "Diễn giải", "TK Nợ (*)", "TK Có (*)", "Số tiền", "Đối tượng", "Khoản mục CP", "Đơn vị", "Đối tượng THCP", "Công trình", "Đơn đặt hàng", "Hợp đồng mua", "Hợp đồng bán", "Mã thống kê", ""];
    const data = [header];
    confirmedIn.forEach((r, i) => {
      // Dùng vị trí GỐC của giao dịch trong toàn bộ danh sách (không phải vị trí sau khi lọc)
      // để số chứng từ luôn ổn định cho đúng 1 giao dịch đó qua nhiều lần xuất file — tránh 2 giao
      // dịch khác nhau bị trùng số chứng từ (do i thay đổi theo số dòng đã xác nhận mỗi lần xuất),
      // khiến MISA gộp nhầm nhiều giao dịch vào chung 1 chứng từ khi import.
      const origIdx = rows.indexOf(r);
      const seq = (origIdx >= 0 ? origIdx : i) + 1;
      const hach = r.confirmedHach || "131";
      // Khách hàng gắn từ Tờ Khai XK chưa có MST (thường gặp với khách nước ngoài) → lấy ĐÚNG
      // NGUYÊN VĂN tên đang gõ trong ô "Nhà cung cấp/Khách hàng" của tờ khai đã gắn tại THỜI ĐIỂM
      // XUẤT (không dùng bản chụp cũ r.confirmedName lúc gắn). Chỉ dùng "KL" (mã hệ thống MISA cố
      // định = "Khách lẻ không lấy hoá đơn") làm mặc định khi THẬT SỰ không có tên nào khác — không
      // dùng cho giao dịch chuyển khoản nội bộ (r.isInternal) hoặc gắn "[TM] Tiền
      // Mặt" (r.isCash) — cả 2 đều không có đối tượng công nợ thật, để trống
      // thay vì điền chữ "Nội bộ"/"Tiền mặt" (sai bản chất, MISA hiểu nhầm
      // thành tên khách hàng/NCC).
      const linkedTk = r.confirmedToKhaiId ? (tokhaiList || []).find(t => t.id === r.confirmedToKhaiId) : null;
      const objectName = (r.isInternal || r.isCash) ? "" : ((linkedTk && linkedTk.nhaCungCap) || r.confirmedName || "");
      const maDoiTuong = r.confirmedMST || objectName || (hach === "131" && !r.isInternal && !r.isCash ? "KL" : "");
      // Số tiền dùng để ghi sổ: nếu là TK USD và đã lấy được tỷ giá → dùng số VND đã quy đổi; nếu là
      // TK USD nhưng KHÔNG lấy được tỷ giá (lỗi mạng/không có dữ liệu ngày đó) → vẫn giữ số USD gốc
      // và cảnh báo cuối cùng để người dùng tự bổ sung tỷ giá, tránh xuất thiếu dòng.
      const vndAmt = r.tx.currency === "USD" ? vndOf.get(r.id) : undefined;
      const bookAmt = vndAmt !== undefined ? vndAmt : (r.tx.credit || 0);
      // GD đã "Tách BHXH" trên màn hình phải tách thành 3 dòng 3383/3384/3386 khi xuất UNT (VD hoàn
      // tiền BHXH nộp thừa) — trước đây bị bỏ qua, xuất ra 1 dòng duy nhất với hạch toán gốc là sai.
      if (r.isBhxh) {
        const amt = bookAmt;
        const base = Math.round(amt / 0.32);
        const p1 = Math.round(base * 0.255);
        const p2 = Math.round(base * 0.045);
        const p3 = amt - p1 - p2;
        const parts = [
          { hach: "3383", amt: p1, label: "BHXH 25.5%" },
          { hach: "3384", amt: p2, label: "BHYT 4.5%" },
          { hach: "3386", amt: p3, label: "BHTN 2%" }
        ];
        parts.forEach((p, idx) => {
          const row = new Array(header.length).fill("");
          const desc = `${r.tx.desc || ""} [${p.label}]`.slice(0, 255);
          row[0] = "0";
          row[1] = r.tx.date;
          row[2] = r.tx.date;
          row[3] = buildVoucherNo("UNT", r.tx.date, `${seq}.${idx+1}`, bankAcct, accountNo);
          row[4] = maDoiTuong;
          row[5] = objectName;
          row[7] = accountNo || "";
          row[8] = bankName || "";
          row[10] = desc;
          row[12] = desc;
          row[13] = bankAcct || "1121";
          row[14] = p.hach;
          row[15] = p.amt;
          row[25] = seq;
          data.push(row);
        });
        return;
      }
      const row = new Array(header.length).fill("");
      row[0] = "0";
      row[1] = r.tx.date;
      row[2] = r.tx.date;
      row[3] = buildVoucherNo("UNT", r.tx.date, seq, bankAcct, accountNo);
      row[4] = maDoiTuong;
      row[5] = objectName;
      row[7] = accountNo || "";
      row[8] = bankName || "";
      row[10] = (r.tx.desc || "").slice(0, 255);
      row[12] = (r.tx.desc || "").slice(0, 255);
      row[13] = bankAcct || "1121";
      row[14] = hach;
      row[15] = bookAmt;
      row[25] = seq;
      data.push(row);
    });
    const ws = XLSX.utils.aoa_to_sheet(data);
    ws["!cols"] = header.map((_, i) => ({ wch: i === 12 ? 60 : i === 3 ? 18 : 14 }));
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Chứng từ thu tiền");

// ── MST Lookup ─────────────────────────────────────────────────────────────────
async function lookupMST(mst) {
  if (!mst || mst.length < 10) throw new Error("MST phải có ít nhất 10 chữ số");
  const clean = mst.replace(/\D/g, "");
  // Try VietQR business API (free, no key required)
  const res = await fetch(`https://api.vietqr.io/v2/business/${clean}`, {
    headers: {
      "Accept": "application/json"
    }
  });
  const json = await res.json();
  if (json.code === "00" && json.data && json.data.name) {
    return {
      name: json.data.name,
      address: json.data.address || ""
    };
  }
  throw new Error("Không tìm thấy MST này");
}

// ── AccountTabs: manage multiple bank accounts per company ─────────────────
// Gợi ý mã TK kế toán dùng khi xuất UNT/UNC (VD: "1121-VCB", "1122" cho USD).
// Mỗi tài khoản ngân hàng nên là 1 mã riêng để khớp với cách MISA tách sổ theo từng NH.
function suggestMisaAcct(label, currency, existingCodes) {
  const base = currency === "USD" ? "1122" : "1121";
  const m = (label || "").toUpperCase().match(/([A-Z]{2,5})/);
  const bankCode = m && m[1] !== "VND" && m[1] !== "USD" ? m[1] : "";
  let suggestion = bankCode ? `${base}-${bankCode}` : base;
  let n = 2;
  while ((existingCodes || []).includes(suggestion)) {
    suggestion = bankCode ? `${base}-${bankCode}${n}` : `${base}-${n}`;
    n++;
  }
  return suggestion;
}

// Tên đầy đủ các ngân hàng phổ biến, đoán từ mã viết tắt xuất hiện trong tên tài khoản (VD nhãn
// "1121-VIETIN-11600294" → đoán ngân hàng "VietinBank") — dùng để điền sẵn ô "Tên ngân hàng", vẫn
// cho người dùng tự sửa lại nếu đoán sai hoặc là ngân hàng không có trong danh sách.
const BANK_NAMES = {
  VCB: "Vietcombank", VIETCOMBANK: "Vietcombank",
  VIETIN: "VietinBank", VIETINBANK: "VietinBank", CTG: "VietinBank",
  BIDV: "BIDV",
  ACB: "ACB",
  TCB: "Techcombank", TECHCOMBANK: "Techcombank",
  MB: "MBBank", MBBANK: "MBBank",
  VPB: "VPBank", VPBANK: "VPBank",
  SHB: "SHB",
  TPB: "TPBank", TP: "TPBank", TPBANK: "TPBank",
  EXIM: "Eximbank", EIB: "Eximbank",
  SEA: "SeABank", SEABANK: "SeABank",
  LPB: "LienVietPostBank", LIENVIET: "LienVietPostBank",
  HDB: "HDBank", HDBANK: "HDBank",
  OCB: "OCB",
  MSB: "MSB",
  SCB: "SCB",
  VIB: "VIB",
  ABB: "ABBank", ABBANK: "ABBank",
  NAB: "Nam A Bank", NAMABANK: "Nam A Bank",
  PVCOMBANK: "PVcomBank", PVB: "PVcomBank",
  SAIGONBANK: "Saigonbank", SGB: "Saigonbank",
  BACABANK: "Bac A Bank", BAB: "Bac A Bank",
  AGRIBANK: "Agribank", AGRI: "Agribank"
};
function suggestBankName(label) {
  const m = (label || "").toUpperCase().match(/([A-Z]{2,10})/g) || [];
  for (const code of m) {
    if (BANK_NAMES[code]) return BANK_NAMES[code];
  }
  return "";
}
// Số TK ngân hàng: lấy cụm số DÀI NHẤT trong nhãn tài khoản (thường là số TK thật, khác với các mã
// ngắn khác có thể lẫn trong nhãn).
function suggestAccountNo(label) {
  const nums = (label || "").match(/\d{4,}/g) || [];
  if (!nums.length) return "";
  return nums.reduce((a, b) => (b.length > a.length ? b : a), nums[0]);
}

  const [pickerHach, setPickerHach] = useState({}); // {invKey: hach_toan}

  const [internalModalFor, setInternalModalFor] = useState(null);

  const [internalModalSkip, setInternalModalSkip] = useState(false);
  const [internalModalOtherRowId, setInternalModalOtherRowId] = useState(null);

  const handleAddExcelFile = file => {

    setAddFileImporting(true);
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const data = new Uint8Array(e.target.result);
        const wb = XLSX.read(data, { type: "array", cellDates: true });
        const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: "", raw: true }).map(r => r.map(xlsxCellToText));
        const txt = rows.filter(r => r.some(c => String(c).trim())).map(r => r.map(c => String(c || "").trim()).join("\t")).join("\n");
        setAddText(txt);

        showToast && showToast(`✓ Đã đọc ${count} giao dịch từ "${file.name}"`, "ok");

      }

    };

  };

  // ── Xác nhận hàng loạt: chọn nhiều dòng giống nhau rồi gán MST/hạch toán 1 lần ──
  const [bulkSelected, setBulkSelected] = useState(new Set());
  const [bulkForm, setBulkForm] = useState({ mst: "", ten_cty: "", hach: "", kw: "" });
  // Tự động bỏ khỏi danh sách "đã chọn" các dòng vừa được xử lý xong (qua ✓ Đúng, Nội bộ, Tiền mặt,
  // Alt+T,... hoặc bất kỳ đường nào khác) — tránh hiện "Đã chọn N dòng" sai lệch khi các dòng đó đã
  // không còn nằm trong danh sách "Chờ" nữa.
  React.useEffect(() => {
    setBulkSelected(prev => {
      if (!prev.size) return prev;
      const next = new Set([...prev].filter(id => {
        const r = rows.find(x => x.id === id);
        return r && !r.confirmed;
      }));
      return next.size === prev.size ? prev : next;
    });
  }, [rows]);
  const internalModalRow = internalModalFor ? rows.find(r => r.id === internalModalFor) : null;
  const internalModalOtherAccounts = (co.accounts||[]).filter(a => a.id !== activeTabAccId);

  const autoOk = rows.filter(r => r.confirmed === "yes" && !r.manualConfirm).length;
  const manualOk = rows.filter(r => r.confirmed === "yes" && r.manualConfirm).length;
  const pending = rows.filter(r => !r.confirmed).length;
  const rejected = rows.filter(r => r.confirmed === "no").length;
  const getBest = r => r.t1_dict || r.t2_nameAmt || (r.invMatches && r.invMatches[0] ? {
    ...r.invMatches[0]
  } : null);
  const overrideRow = (id, mst, name, kw, hach) => {
    // nút "[TM] Tiền Mặt" gọi onOverride(id,"","Tiền mặt","","1111") — đánh dấu
    // riêng để khi xuất Excel KHÔNG điền chữ "Tiền mặt" vào Mã đối tượng/Tên đối
    // tượng (giống cách xử lý giao dịch nội bộ r.isInternal), vì "1111" (tiền
    // mặt tại quỹ) không có đối tượng công nợ thật, điền chữ "Tiền mặt" vào đó
    // là sai bản chất và khiến MISA hiểu nhầm thành 1 khách hàng/NCC tên "Tiền mặt".
    const isCash = hach === "1111" && name === "Tiền mặt" && !mst;
    setRowsH(prev => prev.map(r => {
      if (r.id !== id) return r;
      return {
        ...r,
        confirmed: "yes",
        confirmedMST: mst,
        confirmedName: name,
        confirmedLoai: r.tx.credit > 0 ? "DAURA" : "DAUVAO",
        manualConfirm: true,
        manualKw: kw || "",
        confirmedHach: hach || (r.tx.debit > 0 ? "331" : "131"),
        isCash
      };
    }));
    if (kw && kw.trim().length >= 3) {
      const ownWords = new Set(normVN((co && co.name) || "").split(" ").filter(w => w.length >= 3));
      setTimeout(() => {
        setRowsH(prev => {
          let count = 0;
          const next = prev.map(r => {
            if (r.confirmed || r.id === id) return r;
            const sc = scoreKw(kw, r.tx.desc, ownWords);
            if (sc === 1) {
              count++;
              return {
                ...r,
                confirmed: "yes",
                confirmedMST: mst,
                confirmedName: name,
                confirmedLoai: r.tx.credit > 0 ? "DAURA" : "DAUVAO",
                manualConfirm: true,
                manualKw: kw,
                confirmedHach: hach || (r.tx.debit > 0 ? "331" : "131"),
                t1_dict: {
                  keyword: kw,
                  mst,
                  ten_cty: name,
                  score: 1
                }
              };
            }
            return r;
          });
          if (count > 0) showToast(`Keyword "${kw}" khớp thêm ${count} giao dịch`, "ok");
          return next;
        });
      }, 50);
    }
  };
  const confirmRow = (id, val, mst, name, loai, kw) => setRowsH(prev => prev.map(r => {
    if (r.id !== id) return r;
    // "Không khớp" (val !== "yes") không được mang theo MST/tên/hạch toán của gợi ý bị từ chối
    if (val !== "yes") {
      return {
        ...r,
        confirmed: val,
        confirmedMST: "",
        confirmedName: "",
        confirmedLoai: null,
        confirmedHach: "",
        confirmedInvId: "",
        manualConfirm: true,
        manualKw: kw || ""
      };
    }
    const b = getBest(r);
    const defaultHach = r.tx.debit > 0 ? "331" : "131";
    const dictHach = b && b.hach_toan || "";
    return {
      ...r,
      confirmed: val,
      confirmedMST: mst || b && b.mst || "",
      confirmedName: name || b && b.ten_cty || "",
      confirmedLoai: loai || b && b.loai || (r.tx.credit > 0 ? "DAURA" : "DAUVAO"),
      confirmedHach: r.confirmedHach || dictHach || defaultHach,
      manualConfirm: true,
      manualKw: kw || ""
    };
  }));

  // ── Picker helpers ──────────────────────────────────────────────
  // Tập hợp các hoá đơn đã được gán (đã xác nhận) cho MỘT giao dịch khác — để cảnh báo trùng lặp
  const usedInvIds = React.useMemo(() => {
    const s = new Set();
    rows.forEach(r => {
      if (r.confirmed !== "yes" || r.id === pickerFor || !r.confirmedInvId) return;
      String(r.confirmedInvId).split(",").forEach(k => { if (k) s.add(k); });
    });
    return s;
  }, [rows, pickerFor]);
  const getInvPool = row => {
    const pool = (row.tx.credit > 0 ? invDR : invDV) || [];
    return pool.map(i => ({
      ...i,
      loai: row.tx.credit > 0 ? "DAURA" : "DAUVAO",
      _used: usedInvIds.has(i.id || i.so_hd + "_" + i.ngay)
    }));
  };
  const openPicker = id => {
    const row = rows.find(r => r.id === id);
    const defaultHach = row && row.tx.debit > 0 ? "331" : "131";
    // Pre-fill all invoices in pool with default hach (user can override per-invoice)
    const pool = row ? getInvPool(row) : [];
    const initHach = {};
    pool.forEach(inv => {
      const k = inv.id || inv.so_hd + "_" + inv.ngay;

    setPickerSearch("");
    setPickerSelected(new Set());
    setPickerHach(initHach);
  };
  const closePicker = () => {
    setPickerFor(null);
    setPickerSearch("");
    setPickerSelected(new Set());
    setPickerHach({});
  };
  const pickerRow = pickerFor ? rows.find(r => r.id === pickerFor) : null;
  const pickerPool = pickerRow ? getInvPool(pickerRow) : [];
  const pickerFiltered = pickerSearch ? pickerPool.filter(i => {
    const q = pickerSearch.toLowerCase();
    return (i.ten_cty || "").toLowerCase().includes(q) || (i.mst || "").includes(q) || String(i.so_hd || "").toLowerCase().includes(q) || String(i.tong || 0).includes(q.replace(/[,.đ ]/g, ""));
  }) : pickerPool;
  const txAmt = pickerRow ? Math.max(pickerRow.tx.debit || 0, pickerRow.tx.credit || 0) : 0;
  const selectedInvs = pickerPool.filter(i => pickerSelected.has(i.id || i.so_hd + "_" + i.ngay));
  const selectedSum = selectedInvs.reduce((s, i) => s + (i.tong || 0), 0);
  const sumDiff = selectedSum - txAmt;
  const togglePickerInv = inv => {
    const key = inv.id || inv.so_hd + "_" + inv.ngay;
    const ns = new Set(pickerSelected);
    ns.has(key) ? ns.delete(key) : ns.add(key);
    setPickerSelected(ns);
  };
  const assignInvoice = (rowId, inv, hach) => {
    const invKey = inv.id || inv.so_hd + "_" + inv.ngay;
    if (usedInvIds.has(invKey)) {
      const ok = window.confirm(`Hoá đơn "${inv.so_hd || invKey}" đã được gắn cho 1 giao dịch khác.\nBạn có chắc muốn gắn trùng hoá đơn này không?`);
      if (!ok) return;
    }
    setRowsH(prev => prev.map(r => {
      if (r.id !== rowId) return r;
      return {
        ...r,
        confirmed: "yes",
        confirmedMST: inv.mst || "",
        confirmedName: inv.ten_cty || "",
        confirmedLoai: inv.loai,
        confirmedInvId: invKey,
        manualConfirm: true,
        manualKw: "",
        confirmedHach: hach || inv._hach || inv.hach_toan || (r.tx.debit > 0 ? "331" : "131")
      };
    }));
    closePicker();
    showToast("Đã gắn hoá đơn vào giao dịch");
  };
  const assignSelected = rowId => {
    if (!selectedInvs.length) return;
    const inv = selectedInvs[0];
    const invKeys = selectedInvs.map(i => i.id || i.so_hd + "_" + i.ngay);
    const dupKeys = invKeys.filter(k => usedInvIds.has(k));
    if (dupKeys.length) {
      const ok = window.confirm(`${dupKeys.length} hoá đơn trong lựa chọn đã được gắn cho giao dịch khác.\nBạn có chắc muốn gắn trùng không?`);
      if (!ok) return;
    }
    setRowsH(prev => prev.map(r => {
      if (r.id !== rowId) return r;
      return {
        ...r,
        confirmed: "yes",
        confirmedMST: inv.mst || "",
        confirmedName: inv.ten_cty || "",
        confirmedLoai: inv.loai,
        confirmedInvId: invKeys.join(","),
        manualConfirm: true,
        manualKw: "",
        confirmedNote: `Cộng ${selectedInvs.length} HĐ = ${fmt(selectedSum)}`
      };
    }));
    closePicker();
    showToast(`Đã gắn ${selectedInvs.length} hoá đơn (tổng ${fmt(selectedSum)})`);
  };
  // ── /Picker helpers ──────────────────────────────────────────────

  // Rows with amount mismatch — declared BEFORE filtered so it can be used inside filter callback
  const isMismatchRow = r => {
    const storedAmt = Math.max(r.tx.debit||0, r.tx.credit||0);
    if (!r.tx.rawAmt || !storedAmt) return false;
    let exp = 0;
    r.tx.rawAmt.split("|").forEach(p => { const v = parseNum(p.trim()); if (v > exp) exp = v; });
    if (exp > 0 && Math.abs(exp / storedAmt - 1) > 0.01) return true;
    // Phát hiện đảo Nợ/Có: cột nợ có văn bản gốc nhưng lưu = 0 (hoặc ngược lại với cột có)
    const rawDebitEmpty = !(r.tx.rawDebit && parseNum(r.tx.rawDebit) > 0);
    const rawCreditEmpty = !(r.tx.rawCredit && parseNum(r.tx.rawCredit) > 0);
    if (!rawDebitEmpty && r.tx.debit === 0) return true;
    if (!rawCreditEmpty && r.tx.credit === 0) return true;
    return false;
  };
  const mismatchCount = rows.filter(isMismatchRow).length;

  // Xác nhận rồi mà hạch toán Nợ/Có là 131 (phải thu) hoặc 331 (phải trả) — luôn cần MST đối tác đi
  // kèm để lên chứng từ/xuất UNT-UNC đúng đối tượng. Nếu thiếu MST thì đây gần như chắc chắn là do
  // nhập thiếu, cần cảnh báo để rà lại thay vì phát hiện lúc xuất UNT/UNC.
  // Bỏ qua GD đã gắn Tờ khai NK: nhà cung cấp nước ngoài không có MST Việt Nam nên thiếu MST ở đây
  // là bình thường, không phải thiếu sót cần cảnh báo.
  const isMissingMstRow = r => r.confirmed === "yes" && (r.confirmedHach === "131" || r.confirmedHach === "331") && !r.confirmedMST && !r.confirmedToKhaiId;
  const missingMstCount = rows.filter(isMissingMstRow).length;

  // Phát hiện hạch toán ngược chiều dòng tiền — dấu hiệu chọn nhầm hạch toán:
  // • Dòng TIỀN VÀO (Có = confirmedHach) mà lại hạch toán 331 (phải trả người bán) hoặc TK loại 6
  //   (chi phí) — tiền vào không thể là trả nợ hay chi phí.
  // • Dòng TIỀN RA (Nợ = confirmedHach) mà lại hạch toán 131 (phải thu khách hàng) hoặc TK loại 5/7
  //   (doanh thu/thu nhập khác) — tiền ra không thể là thu tiền hay doanh thu.
  // Bỏ qua dòng chuyển khoản nội bộ ("X", đã hạch toán đủ 2 vế ở nơi khác) và dòng tách BHXH (322x/338x).
  const isWrongDirectionHachRow = r => {
    if (r.confirmed !== "yes" || !r.confirmedHach || r.confirmedHach === "X" || r.isBhxh) return false;
    const hach = String(r.confirmedHach).trim();
    const isIn = (r.tx.credit || 0) > 0;
    const isOut = (r.tx.debit || 0) > 0;
    if (isIn && (hach === "331" || hach.startsWith("6"))) return true;
    if (isOut && (hach === "131" || hach.startsWith("5") || hach.startsWith("7"))) return true;
    return false;
  };
  const wrongHachCount = rows.filter(isWrongDirectionHachRow).length;
  // Danh sách các mã hạch toán đã dùng (để lọc theo đúng 1 mã, VD lọc riêng "331" hoặc "1111")
  const usedHachCodes = [...new Set(rows.filter(r => r.confirmed === "yes" && r.confirmedHach).map(r => r.confirmedHach))].sort();

  const filtered = rows.filter(r => {
    if (filter === "pending" && r.confirmed) return false; // truthy = any confirmed state
    if (filter === "manual" && (r.confirmed !== "yes" || !r.manualConfirm)) return false;
    if (filter === "auto" && (r.confirmed !== "yes" || r.manualConfirm)) return false;
    if (filter === "no" && r.confirmed !== "no") return false;
    if (filter === "mismatch" && !isMismatchRow(r)) return false;
    if (filter === "missingmst" && !isMissingMstRow(r)) return false;
    if (filter === "wronghach" && !isWrongDirectionHachRow(r)) return false;
    if (hachFilter && r.confirmedHach !== hachFilter) return false;
    if (search && !r.tx.desc.toLowerCase().includes(search.toLowerCase()) && !(r.confirmedName || "").toLowerCase().includes(search.toLowerCase())) return false;
    return true;
    // Sort: tiền vào (credit) first, then tiền ra (debit) - display only, NOT for export
  }).filter(r => {
    // Double-safety: when filter=pending, never let a confirmed row slip through
    if (filter === "pending" && r.confirmed) return false;
    return true;
  }).sort((a, b) => {
    const aIsIn = a.tx.credit > 0 ? 0 : 1;
    const bIsIn = b.tx.credit > 0 ? 0 : 1;
    if (aIsIn !== bIsIn) return aIsIn - bIsIn;
    return 0;
  });
  const addToDict = (mst, ten_cty, kw, isGlobal, hach) => {
    if (!kw) return;
    const entry = {
      id: uid(),
      keyword: kw,
      mst: mst || "",
      ten_cty: ten_cty || "",
      hach_toan: hach || "",
      note: "Bo sung khi do",
      hits: 0,
      source: "manual",
      created: new Date().toLocaleDateString("vi-VN")
    };
    if (isGlobal) onSaveGl([...globalDict, entry]);else onSaveCo([...coDict, entry]);
    showToast(`Đã thêm "${kw}" vào từ điển`);
  };

  // ── Bulk actions: chọn nhiều dòng giống nhau, gán MST/hạch toán 1 lần ──────
  const toggleBulkSelect = id => setBulkSelected(prev => {
    const ns = new Set(prev);
    ns.has(id) ? ns.delete(id) : ns.add(id);
    return ns;
  });
  const toggleBulkSelectAll = () => {
    // Chọn tất cả các dòng đang hiển thị theo bộ lọc hiện tại (kể cả dòng đã xác nhận,
    // VD lọc "thiếu MST" để sửa hàng loạt), không giới hạn chỉ dòng chờ xử lý.
    const ids = filtered.map(r => r.id);
    const allSelected = ids.length > 0 && ids.every(id => bulkSelected.has(id));
    setBulkSelected(allSelected ? new Set() : new Set(ids));
  };
  const clearBulkSelection = () => {
    setBulkSelected(new Set());
    setBulkForm({ mst: "", ten_cty: "", hach: "", kw: "" });
  };
  // Click 1 gợi ý trên dòng → đổ luôn MST/Tên công ty/Hạch toán vào khung "Đã chọn N dòng" phía trên,
  // giống hệt cách "Nhập khác" đổ vào form sửa của từng dòng — để áp dụng nhanh cho cả lô đang chọn.
  const fillBulkForm = (inv, defHach) => {
    setBulkForm(f => ({
      ...f,
      mst: inv.mst || "",
      ten_cty: inv.ten_cty || "",
      hach: inv.hach_toan || f.hach || defHach || ""
    }));
  };
  const bulkConfirmSelected = () => {
    if (!bulkSelected.size) return;
    const mst = bulkForm.mst.trim();
    const ten_cty = bulkForm.ten_cty.trim();
    const hach = bulkForm.hach.trim();
    const kw = bulkForm.kw.trim();
    const n = bulkSelected.size;
    setRowsH(prev => prev.map(r => {
      if (!bulkSelected.has(r.id)) return r;
      return {
        ...r,
        confirmed: "yes",
        confirmedMST: mst || r.confirmedMST || "",
        confirmedName: ten_cty || r.confirmedName || "",
        confirmedLoai: r.tx.credit > 0 ? "DAURA" : "DAUVAO",
        confirmedHach: hach || r.confirmedHach || (r.tx.debit > 0 ? "331" : "131"),
        manualConfirm: true,
        manualKw: kw || r.manualKw || ""
      };
    }));
    if (kw.length >= 3 && (mst || ten_cty)) addToDict(mst, ten_cty, kw, false, hach);
    showToast(`✓ Đã xác nhận hàng loạt ${n} giao dịch`);
    setBulkSelected(new Set());
    setBulkForm({ mst: "", ten_cty: "", hach: "", kw: "" });

  const bulkRejectSelected = () => {

    setRowsH(prev => prev.map(r => {
      if (!bulkSelected.has(r.id)) return r;
