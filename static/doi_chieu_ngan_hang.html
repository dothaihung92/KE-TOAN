        confirmedInvId: "",
        manualConfirm: true
      };
    }));
    showToast(`Đã đánh dấu "Không khớp" cho ${n} giao dịch`);
    setBulkSelected(new Set());
  };

  const [focusIdx, setFocusIdx] = useState(0);
  const listRef = React.useRef(null);
  const searchInputRef = React.useRef(null);

  // Only auto-scroll when navigating with keyboard (Arrow keys), not on mouse click
  const keyboardNavRef = React.useRef(false);
  React.useEffect(() => {
    if (!keyboardNavRef.current) return; // skip if triggered by mouse click
    keyboardNavRef.current = false;
    if (!listRef.current) return;
    const rows = listRef.current.querySelectorAll("[data-row]");
    const el = rows[focusIdx];
    if (!el) return;
    const elRect = el.getBoundingClientRect();
    const vh = window.innerHeight;
    // Only scroll if not fully in viewport (with 80px margin for sticky header)
    if (elRect.top < 80 || elRect.bottom > vh - 20) {
      el.scrollIntoView({
        block: "nearest",
        behavior: "smooth"
      });
    }
  }, [focusIdx]);
  React.useEffect(() => {
    const handler = e => {
      // Alt+F focus vào ô tìm nội dung thay vì mở tìm kiếm mặc định của trình duyệt
      if (e.altKey && (e.key === "f" || e.key === "F")) {
        e.preventDefault();
        if (searchInputRef.current) { searchInputRef.current.focus(); searchInputRef.current.select(); }
        return;
      }
      // Ctrl/Cmd+S = Lưu & học, thay vì mở hộp thoại "Lưu trang" mặc định của trình duyệt
      if ((e.ctrlKey || e.metaKey) && (e.key === "s" || e.key === "S")) {
        e.preventDefault();
        handleSaveAndLearn();
        return;
      }
      // Fix 2: Esc only closes picker or edit — never navigates away
      if (e.key === "Escape") {
        e.preventDefault();
        if (pickerFor) {
          closePicker();
          return;
        }
        const bulkFormHasText = bulkForm.mst || bulkForm.ten_cty || bulkForm.hach || bulkForm.kw;
        if (bulkSelected.size > 0 || bulkFormHasText) {
          clearBulkSelection();
          return;
        }
        if (search) {
          setSearch("");
          return;
        }
        // Signal all ConfirmRows to close edit mode via a custom event
        window.dispatchEvent(new CustomEvent("closeEditMode"));
        return;
      }
      if(e.altKey&&(e.key==="g"||e.key==="G")){e.preventDefault();if(pickerFor)assignSelected(pickerFor);return;}
      // Alt+C = Chọn HĐ (open picker for focused row) — chạy trước khi bị chặn bởi input/textarea
      // để dùng được ngay cả khi đang gõ trong ô tìm kiếm.
      if (e.altKey && (e.key === "c" || e.key === "C")) {
        e.preventDefault();
        if (!pickerFor && filtered[focusIdx]) openPicker(filtered[focusIdx].id);
        return;
      }
      if(e.altKey&&(e.key==="t"||e.key==="T")){e.preventDefault();if(filtered[focusIdx])overrideRow(filtered[focusIdx].id,"","Ti\u1EC1n m\u1EB7t","","1111");return;}
      // Alt+A = Chọn tất cả (các dòng đang lọc) — chạy trước khi bị chặn bởi input/textarea để dùng được
      // ngay cả khi đang gõ trong ô tìm kiếm (VD sau khi Alt+F vào ô lọc).
      if(e.altKey&&(e.key==="a"||e.key==="A")){e.preventDefault();toggleBulkSelectAll();return;}
      if(pickerFor)return;
      const tag=e.target.tagName;
      if(tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT")return;
      if((e.ctrlKey||e.metaKey)&&e.key==="z"&&!e.shiftKey){e.preventDefault();undo();return;}
      if((e.ctrlKey||e.metaKey)&&(e.key==="y"||(e.key==="z"&&e.shiftKey))){e.preventDefault();redo();return;}
      // Alt+G = Gắn (assign selected invoice in picker)
      if (e.altKey && (e.key === "g" || e.key === "G")) {
        e.preventDefault();
        if (pickerFor) assignSelected(pickerFor);
        return;
      }
      if (e.key === "Enter" || e.key === "ArrowRight") {
        e.preventDefault();
        // Nếu đang có dòng nào được tick chọn (kể cả chỉ 1 dòng) → Enter xác nhận theo đúng thông tin
        // đã điền ở khung "Đã chọn N dòng" phía trên (giống nút "Xác nhận đã chọn"). Trước đây chỉ
        // dùng đường này khi chọn > 1 dòng, nên với đúng 1 dòng được tick + đã gõ MST/tên/hạch toán,
        // Enter lại đi theo nhánh xác nhận "trống" (dùng gợi ý tự động, có thể không có) khiến MST đã
        // nhập bị bỏ qua — phải bấm "Lưu GD này thôi" mới thực sự lưu.
        if (bulkSelected.size >= 1) { bulkConfirmSelected(); }
        else if (filtered[focusIdx]) confirmRow(filtered[focusIdx].id, "yes", null, null, null, "");
      } else if (e.key === "ArrowDown") {
        e.preventDefault();
        keyboardNavRef.current = true;
        setFocusIdx(i => Math.min(i + 1, filtered.length - 1));
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        keyboardNavRef.current = true;
        setFocusIdx(i => Math.max(i - 1, 0));
      } else if (e.key === "n" || e.key === "N") {
        if (filtered[focusIdx]) confirmRow(filtered[focusIdx].id, "no", null, null, null, "");
      }
    };
    window.addEventListener("keydown", handler);
    return () => window.removeEventListener("keydown", handler);
  }, [focusIdx, filtered, pickerFor, bulkSelected, bulkForm, search]);
  // Bỏ phần giờ nếu có (VD sao kê VietinBank ghi "15-07-2025 08:59:05") trước khi so khớp ngày —
  // nếu không, regex ngày sẽ không khớp và bị fallback sang new Date() (hiểu sai dd-mm-yyyy) → GD bị loại nhầm.
  const parseVNDateI = d => { if(!d)return null; const s=String(d).trim().split(/\s+/)[0]; const m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{4})$/); return m?new Date(m[3]+"-"+m[2].padStart(2,"0")+"-"+m[1].padStart(2,"0")):new Date(d); };
  // Tìm ĐÚNG key session của 1 tài khoản trong LS — không chỉ thử key ghép chuẩn "coId_accId" mà
  // còn quét toàn bộ session index của công ty khi key chuẩn không có dữ liệu (VD tài khoản đó được
  // lưu từ trước khi hỗ trợ nhiều TK, chỉ dưới key "coId" đơn thuần). Dùng chung cho MỌI chỗ đọc/ghi
  // dữ liệu "tài khoản kia" (gợi ý nội bộ + ghi dấu X) để không bao giờ lệch key giữa đọc và ghi.
  const resolveSessionKeyFor = accId => {
    const ls = accId ? co.id+"_"+accId : co.id;
    if (LS.get("session_"+ls)) return ls;
    const idx = getSessionIndex(co.id);
    for (const key2 of idx) {
      const candidate = LS.get("session_"+key2);
      if (candidate && candidate.results && candidate.results.length &&
          (candidate.accountId === accId || key2 === ls)) return key2;
    }
    return ls;
  };
  // Luôn đọc TRỰC TIẾP từ LocalStorage (không dùng cache trong bộ nhớ) — vì gợi ý chuyển tiền nội
  // bộ cần phản ánh đúng trạng thái MỚI NHẤT của tài khoản kia (VD vừa xác nhận Tiền mặt/hoá đơn ở
  // đó), tránh trường hợp bộ nhớ đệm cũ khiến gợi ý không hiện dù dữ liệu thực tế đã đúng.
  const getOtherRows = accId => {
    const k=String(accId);
    const ls=resolveSessionKeyFor(accId);
    let s=LS.get("session_"+ls);
    if(!s||!s.results||!s.results.length){
      const idx=getSessionIndex(co.id);
      for(const key2 of idx){
        const candidate=LS.get("session_"+key2);
        if(candidate&&candidate.results&&candidate.results.length&&
           (candidate.accountId===accId||key2===ls)){ s=candidate; break; }
      }
    }
    if(s&&s.results&&s.results.length){ rowsCache.current[k]=s.results; return s.results; }
    if(rowsCache.current[k]&&rowsCache.current[k].length>0) return rowsCache.current[k];
    return [];
  };
  // Lọc ứng viên cho 1 tài khoản cụ thể: đúng chiều ngược dấu + lệch tối đa 7 ngày + KHỚP ĐÚNG SỐ TIỀN.
  // Chuyển khoản nội bộ giữa 2 TK của cùng công ty thì số tiền 2 bên luôn giống hệt nhau (trừ khi có phí
  // ngân hàng cộng thêm — trường hợp đó xử lý riêng bằng "Nhập khác"), nên không cần hiện các số tiền khác.
  const findInternalCandidatesFor = (txRow, accId) => {
    const myIsCredit = (txRow.tx.credit||0) > 0;
    const myAmt = Math.max(txRow.tx.debit||0, txRow.tx.credit||0);
    const txDate = parseVNDateI(txRow.tx.date);
    // TK đích khác loại tiền (VD TK VND ↔ TK USD, kiểu "mua ngoại tệ thanh toán") thì không thể so
    // khớp đúng số tiền (một bên là VND, bên kia là USD, số không bao giờ bằng nhau) — chuyển sang so
    // khớp theo ngày sát nhau (≤3 ngày) + nội dung diễn giải trùng nhiều từ đặc trưng (VD cùng số hoá
    // đơn/tên đối tác) để vẫn nhận diện được, tránh ghép nhầm do chỉ so ngày không thôi.
    const otherAcc = (co.accounts||[]).find(a => a.id === accId);
    const myCurrency = activeTabAcc ? activeTabAcc.currency : "VND";
    const crossCurrency = !!(otherAcc && otherAcc.currency && myCurrency && otherAcc.currency !== myCurrency);
    const myWords = crossCurrency ? new Set(normVN(txRow.tx.desc).split(" ").filter(w => w.length >= 3 && !STOP.has(w))) : null;
    const oRows = getOtherRows(accId).filter(o => {
      // Chỉ loại các dòng đã CHẮC CHẮN xử lý xong (đã ghép nội bộ, hoặc đã gắn đúng hoá đơn/MST) —
      // KHÔNG loại các dòng chỉ mới bị gán tạm "Tiền mặt" (không MST, không phải nội bộ), vì đây
      // thường là trường hợp người dùng bấm Alt+T do lúc đó chưa có gợi ý, thực chất vẫn có thể là
      // chuyển khoản nội bộ và cần được gợi ý lại để sửa.
      if (o.confirmed === "yes" && (o.isInternal || o.confirmedMST)) return false;
      if (o.confirmed === "no") return false;
      if (myIsCredit ? !((o.tx.debit||0) > 0) : !((o.tx.credit||0) > 0)) return false;
      const oAmt = Math.max(o.tx.debit||0, o.tx.credit||0);
      if (crossCurrency) {
        if (!(oAmt > 0)) return false;
        if (!txDate || !o.tx.date || Math.abs((txDate - parseVNDateI(o.tx.date)) / 86400000) > 3) return false;
        const oWords = normVN(o.tx.desc).split(" ").filter(w => w.length >= 3 && !STOP.has(w));
        if (!oWords.length || !myWords.size) return false;
        const overlap = oWords.filter(w => myWords.has(w)).length;
        return overlap / Math.max(myWords.size, oWords.length) >= 0.4;
      }
      if (!(myAmt > 0 && oAmt > 0 && Math.abs(oAmt - myAmt) < 1)) return false;
      if (!txDate || !o.tx.date) return true;
      return Math.abs((txDate - parseVNDateI(o.tx.date)) / 86400000) <= 7;
    });
    return oRows.map(o => {
      let dayDiff = Infinity;
      if (txDate && o.tx.date) dayDiff = Math.abs((txDate - parseVNDateI(o.tx.date)) / 86400000);
      return { o, dayDiff };
    }).sort((a, b) => a.dayDiff - b.dayDiff);
  };
  const loadInternalCandidates = (rowId, accId) => {
    if(!accId||!rowId){setInternalModalCandidates([]);return;}
    const txRow=rows.find(r=>r.id===rowId); if(!txRow)return;
    const scored = findInternalCandidatesFor(txRow, accId).slice(0, 20);
    const cands = scored.map(x=>x.o);
    setInternalModalCandidates(cands);
    // Đã lọc đúng số tiền rồi — chỉ cần lấy GD gần ngày nhất làm lựa chọn mặc định
    if (scored.length) setInternalModalOtherRowId(scored[0].o.id);
    else setInternalModalOtherRowId(null);
  };
  // Dò XUYÊN SUỐT tất cả tài khoản ngân hàng khác để tìm sẵn GD khớp đúng số tiền + gần ngày nhất,
  // khỏi bắt người dùng phải tự chọn đúng tài khoản ngân hàng trước rồi mới thấy gợi ý.
  const findBestInternalAcrossAccounts = (rowId) => {
    const txRow = rows.find(r => r.id === rowId);
    if (!txRow) return null;
    let best = null;
    for (const acc of internalModalOtherAccounts) {
      const scored = findInternalCandidatesFor(txRow, acc.id);
      if (scored.length && (!best || scored[0].dayDiff < best.dayDiff)) {
        best = { accId: acc.id, rowId: scored[0].o.id, dayDiff: scored[0].dayDiff };
      }
    }
    return best;
  };
  // Extract bank code from account label: "1121-MB"→MB, "1121-TCB-86878788"→TCB, "1234 - VPB"→VPB
  const getBankCode = (accId) => {
    const acc = (co.accounts||[]).find(a => a.id === accId);
    if (!acc || !acc.label) return "";
    // First sequence of 2-5 uppercase letters in the label (skips leading digits like "1121-")
    const m = acc.label.toUpperCase().match(/([A-Z]{2,5})/);
    const code = m ? m[1] : "";
    return code === "VND" || code === "USD" ? "" : code; // ignore currency words
  };
  const getDefaultHach = (accId) => {
    const acc = (co.accounts||[]).find(a => a.id === accId);
    if (!acc) return "1121";
    // Use the FULL account label as hạch toán (e.g. "1121-TCB-86878788", "1121-MB")
    const lbl = (acc.label || "").trim();
    if (lbl) return lbl;
    return acc.currency === "USD" ? "1122" : "1121";
  };

  const openInternalModal = rowId => {
    const txRow=rows.find(r=>r.id===rowId);
    // Tự tìm trước xem có TK ngân hàng nào khác đang chứa GD khớp đúng số tiền không, để chọn sẵn TK đó
    // thay vì luôn mặc định TK đầu tiên trong danh sách rồi bắt người dùng tự bấm qua từng TK để tìm.
    const auto=findBestInternalAcrossAccounts(rowId);
    const fa=auto?internalModalOtherAccounts.find(a=>a.id===auto.accId):internalModalOtherAccounts[0];
    const aid=fa?fa.id:null;
    setInternalModalFor(rowId);setInternalModalAccId(aid);
    setInternalModalHach(getDefaultHach(aid));
    setInternalModalSkip(txRow?txRow.tx.debit>0:false);
    setInternalModalOtherRowId(null);setInternalModalCandidates([]);setInternalModalSearch("");
    if(aid)loadInternalCandidates(rowId,aid);
  };
  const closeInternalModal = () => {setInternalModalFor(null);setInternalModalCandidates([]);setInternalModalSearch("");};
  const internalTransferRow = (id, accId, accLabel, accCurrency, hach, isSkip, otherRowId) => {
    const myLabel=activeTabAcc?activeTabAcc.label:"",myCur=activeTabAcc?activeTabAcc.currency:"";
    const lT=`\u21D4 N\u1ED9i b\u1ED9 \u2013 ${isSkip?"Chuy\u1EC3n sang":"Nh\u1EADn t\u1EEB"} ${accLabel} (${accCurrency})`;
    const lO=`\u21D4 N\u1ED9i b\u1ED9 \u2013 ${isSkip?"Nh\u1EADn t\u1EEB":"Chuy\u1EC3n sang"} ${myLabel} (${myCur})`;
    const myRow=rows.find(r=>r.id===id);
    setRowsH(prev=>prev.map(r=>r.id!==id?r:{...r,confirmed:"yes",confirmedMST:"",confirmedName:lT,
      confirmedLoai:r.tx.credit>0?"DAURA":"DAUVAO",confirmedHach:hach||"1121",
      manualConfirm:true,isInternal:true,internalAccId:accId,internalAccLabel:accLabel,internalSkip:isSkip}));
    if(otherRowId){
      const ck=String(accId),upd={confirmed:"yes",confirmedMST:"",confirmedName:lO,confirmedHach:"X",
        manualConfirm:true,isInternal:true,internalAccId:activeTabAccId,internalAccLabel:myLabel,internalSkip:!isSkip};
      if(!crossTabPending.current[ck])crossTabPending.current[ck]={};
      crossTabPending.current[ck][otherRowId]=upd;
      if(rowsCache.current[ck]&&rowsCache.current[ck].length>0)
        rowsCache.current[ck]=rowsCache.current[ck].map(r=>r.id===otherRowId?{...r,...upd}:r);
      const lk=resolveSessionKeyFor(accId),s=LS.get("session_"+lk);
      if(s&&s.results){
        let matched=false;
        let ur=s.results.map(r=>{
          if(r.id===otherRowId){matched=true;return{...r,...upd};}
          return r;
        });
        // N\u1EBFu kh\u00F4ng t\u00ECm th\u1EA5y \u0111\u00FAng ID (VD d\u1EEF li\u1EC7u TK kia \u0111\u00E3 \u0111\u01B0\u1EE3c x\u1EED l\u00FD l\u1EA1i sau khi g\u1EE3i \u00FD \u0111\u01B0\u1EE3c t\u00EDnh,
        // khi\u1EBFn ID c\u0169 kh\u00F4ng c\u00F2n kh\u1EDBp) \u2014 d\u00F2 l\u1EA1i theo \u0110\u00DANG s\u1ED1 ti\u1EC1n + ng\u01B0\u1EE3c d\u1EA5u + g\u1EA7n ng\u00E0y nh\u1EA5t, \u0111\u1EC3
        // tr\u00E1nh im l\u1EB7ng b\u1ECF qua khi\u1EBFn b\u00EAn kia kh\u00F4ng bao gi\u1EDD \u0111\u01B0\u1EE3c \u0111\u00E1nh d\u1EA5u X.
        if(!matched&&myRow){
          const myAmt=Math.max(myRow.tx.debit||0,myRow.tx.credit||0);
          const myIsCredit=(myRow.tx.credit||0)>0;
          const cands=s.results.filter(r=>{
            if(r.confirmed)return false;
            if(myIsCredit?!((r.tx.debit||0)>0):!((r.tx.credit||0)>0))return false;
            return Math.abs(Math.max(r.tx.debit||0,r.tx.credit||0)-myAmt)<1;
          });
          if(cands.length){
            const pick=cands[0].id;
            ur=s.results.map(r=>r.id===pick?{...r,...upd}:r);
            matched=true;
          }
        }
        LS.set("session_"+lk,{...s,results:ur});
        rowsCache.current[ck]=ur;
        if(!matched&&showToast)showToast("\u26A0 Kh\u00F4ng t\u00ECm th\u1EA5y GD t\u01B0\u01A1ng \u1EE9ng \u1EDF "+accLabel+" \u0111\u1EC3 \u0111\u00E1nh d\u1EA5u X \u2014 h\u00E3y ki\u1EC3m tra l\u1EA1i th\u1EE7 c\u00F4ng","warn");
      }
    }
  };

  // Gợi ý chuyển khoản nội bộ hiển thị thẳng trên từng dòng (không cần mở modal) — cùng logic dò
  // xuyên suốt các TK khác như openInternalModal, nhưng tính sẵn cho TẤT CẢ các dòng đang chờ xử lý.
  // Chỉ tính lại khi rows/danh sách TK thực sự đổi (không phải mỗi lần gõ ô tìm kiếm) để tránh giật lag.
  const internalSuggestions = React.useMemo(() => {
    const map = {};
    rows.forEach(r => {
      if (r.confirmed) return;
      let best = null;
      for (const acc of internalModalOtherAccounts) {
        const scored = findInternalCandidatesFor(r, acc.id);
        if (scored.length && (!best || scored[0].dayDiff < best.dayDiff)) {
          best = { accId: acc.id, accLabel: acc.label, accCurrency: acc.currency, row: scored[0].o, dayDiff: scored[0].dayDiff };
        }
      }
      if (best) map[r.id] = best;
    });
    return map;
  }, [rows, co.accounts, activeTabAccId]);

  const quickAcceptInternal = (rowId, sug) => {
    const txRow = rows.find(r => r.id === rowId);
    if (!txRow || !sug) return;
    const hach = getDefaultHach(sug.accId);
    const isSkip = txRow.tx.debit > 0;
    internalTransferRow(rowId, sug.accId, sug.accLabel, sug.accCurrency, hach, isSkip, sug.row.id);
    showToast("✓ Đã tự xác nhận chuyển khoản nội bộ với " + sug.accLabel);
  };

  // ── Gợi ý gắn Tờ khai Hải quan (NK/XK) vào GD thanh toán (NK: tiền ra, XK: tiền vào) ────────────
  // TOÀN BỘ logic bên dưới dùng CHUNG cho cả 2 loại tờ khai (NK và XK), tham số hoá qua "kind"
  // ("NK" mặc định hoặc "XK") — thay vì viết lại 2 lần, chỉ khác nhau ở: chiều giao dịch khớp
  // (NK→tiền ra/debit, XK→tiền vào/credit), tài khoản hạch toán mặc định (NK→331 phải trả, XK→131
  // phải thu), và CHIỀU dấu lãi/lỗ khi tự động tính từ chênh lệch (xem fxKindFromDiff bên dưới).
  const tokhaiListOf = kind => kind === "XK" ? tokhaiXKList : tokhaiList;
  const saveTokhaiListOf = kind => kind === "XK" ? saveTokhaiXKList : saveTokhaiList;
  const tokhaiPickForRowOf = kind => kind === "XK" ? tokhaiXKPickForRow : tokhaiPickForRow;
  const setTokhaiPickForRowOf = kind => kind === "XK" ? setTokhaiXKPickForRow : setTokhaiPickForRow;
  const setTokhaiModalOpenOf = kind => kind === "XK" ? setTokhaiXKModalOpen : setTokhaiModalOpen;
  const splitFlowOf = kind => kind === "XK" ? splitFlowXK : splitFlow;
  const setSplitFlowOf = kind => kind === "XK" ? setSplitFlowXK : setSplitFlow;
  const defaultHachOf = kind => kind === "XK" ? "131" : "331";
  const txAmtOf = (kind, tx) => kind === "XK" ? (tx.credit || 0) : (tx.debit || 0);
  // Tờ khai đã "chốt" (đã hạch toán lãi/lỗ chênh lệch tỷ giá cho lần thanh toán cuối) coi như đã
  // thanh toán xong hẳn — không cần gợi ý nữa dù có giao dịch nào khác trùng số tiền/số hoá đơn.
  const isTokhaiClosed = tk => tkPayments(tk).some(p => {
    const pr = rows.find(rr => rr.id === p.rowId);
    return pr && pr.fxSplit;
  });
  const findTokhaiSuggestions = (kind, row) => {
    if (!(txAmtOf(kind, row.tx) > 0)) return [];
    const descU = tkCore(row.tx.desc);
    return tokhaiListOf(kind).filter(tk => {
      if (isTokhaiClosed(tk)) return false;
      // KHÔNG loại tờ khai đã có GD gắn (nhưng CHƯA chốt) — 1 tờ khai có thể được trả/thu làm nhiều
      // lần khác ngày (đặt cọc trước, trả/thu nốt sau...), nên vẫn phải tiếp tục gợi ý cho lần sau.
      // "Số hoá đơn" trên tờ khai thường có dạng "A - 25LN0088" (chữ "A" là ký hiệu MẪU hoá đơn,
      // không phải số hoá đơn thật) — nhưng sao kê ngân hàng chỉ ghi số thật "25LN0088", không kèm
      // ký hiệu mẫu. Trước đây so cả chuỗi "A25LN0088" nên không bao giờ khớp được — bỏ phần ký
      // hiệu mẫu (chữ cái + dấu gạch ngang ở đầu) trước khi so khớp.
      const invCore = tkCore(String(tk.soHoaDon || "").replace(/^[A-Za-z]{1,3}\s*-\s*/, ""));
      if (invCore.length >= 4 && descU.includes(invCore)) return true;
      const tkSoCore = String(tk.toKhaiSo || "").replace(/\D/g, "");
      if (tkSoCore.length >= 6 && descU.includes(tkSoCore)) return true;
      // So khớp theo SỐ TIỀN NGOẠI TỆ ghi rõ trong nội dung giao dịch (VD "13,350 USD") với số còn
      // phải trả/thu của tờ khai (trị giá HĐ trừ các lần đã trả/thu trước đó, quy đổi theo tỷ giá
      // tính thuế) — đáng tin cậy vì đây là số tiền THẬT ghi trong sao kê, không phải suy đoán, chỉ
      // cho dung sai rất nhỏ (0.5%) để tránh trùng ngẫu nhiên với giao dịch không liên quan.
      const foreignAmt = extractForeignAmt(row.tx.desc, tk.currency);
      if (foreignAmt > 0) {
        const remainForeign = tk.tyGiaTinhThue > 0
          ? (tkTaxVND(tk) - tkTotalPaidVND(tk)) / tk.tyGiaTinhThue
          : tk.triGiaHoaDon;
        if (remainForeign > 0 && Math.abs(foreignAmt - remainForeign) / remainForeign <= 0.005) return true;
      }
      return false;
    });
  };
  const tokhaiSuggestions = React.useMemo(() => {
    const map = {};
    rows.forEach(r => {
      if (r.confirmed) return;
      // Đánh dấu _tkKind trên MỖI gợi ý (NK hay XK) — vì 1 dòng giao dịch có thể vừa gợi ý tờ khai
      // NK vừa gợi ý tờ khai XK (hiếm nhưng có thể xảy ra), cần biết đúng loại để gọi attachTokhai
      // (kind, rowId, tokhaiId) đúng danh sách khi người dùng bấm chọn.
      const sug = (r.tx.debit > 0 ? findTokhaiSuggestions("NK", r).map(tk => ({ ...tk, _tkKind: "NK" })) : [])
        .concat(r.tx.credit > 0 ? findTokhaiSuggestions("XK", r).map(tk => ({ ...tk, _tkKind: "XK" })) : []);
      if (sug.length) map[r.id] = sug;
    });
    return map;
  }, [rows, tokhaiList, tokhaiXKList]);
  // 1 tờ khai có thể gắn với NHIỀU giao dịch thanh toán khác ngày (trả/thu cọc trước, trả/thu nốt
  // sau...) — mỗi lần gắn sẽ THÊM một lần thanh toán mới vào danh sách (payments), không ghi đè.
  const attachTokhai = (kind, rowId, tokhaiId) => {
    const list = tokhaiListOf(kind);
    const tk = list.find(t => t.id === tokhaiId);
    const row = rows.find(r => r.id === rowId);
    if (!tk || !row) return;
    setRowsH(prev => prev.map(r => r.id !== rowId ? r : {
      ...r, confirmed: "yes", confirmedName: tk.nhaCungCap || r.confirmedName,
      confirmedHach: r.confirmedHach || defaultHachOf(kind), manualConfirm: true, confirmedToKhaiId: tk.id
    }));
    const bankVND = Math.max(row.tx.debit || 0, row.tx.credit || 0);
    const remainForeignEst = tk.tyGiaTinhThue > 0 ? Math.round((tkTaxVND(tk) - tkTotalPaidVND(tk)) / tk.tyGiaTinhThue * 100) / 100 : 0;
    const bankAmt = extractForeignAmt(row.tx.desc, tk.currency) || remainForeignEst || 0;
    const bankRate = bankAmt > 0 ? Math.round(bankVND / bankAmt) : 0;
    const existingPayments = tkPayments(tk).filter(p => p.rowId !== rowId);
    const newPayments = [...existingPayments, { rowId, bankDate: row.tx.date, bankAmt, bankRate, bankVND }];
    saveTokhaiListOf(kind)(list.map(t => t.id !== tk.id ? t : {
      ...t, payments: newPayments,
      linkedRowId: undefined, bankDate: undefined, bankAmt: undefined, bankRate: undefined, bankVND: undefined
    }));
    showToast("✓ Đã gắn tờ khai " + tk.toKhaiSo + " vào giao dịch (lần TT thứ " + newPayments.length + ")");
    setTokhaiPickForRowOf(kind)(null);
    setTokhaiModalOpenOf(kind)(false);
  };
  const openTokhaiPicker = (kind, rowId) => { setTokhaiPickForRowOf(kind)(rowId); setTokhaiModalOpenOf(kind)(true); };
  // Thanh toán "gối đầu" — 1 giao dịch NH trả/thu 1 lần nhưng tiền được CHIA cho nhiều tờ khai khác
  // nhau (VD trả 5.000$: 3.000$ tất toán tờ khai A đang thiếu, 2.000$ còn dư dùng đặt cọc trước cho
  // tờ khai B chưa tới hạn). allocations: [{tokhaiId, amtVND}, ...] — ghi 1 payment riêng vào MỖI
  // tờ khai với đúng phần tiền được chia, quy đổi lại bankAmt/bankRate theo tỷ giá tính thuế của
  // TỪNG tờ khai (chính xác hơn dò tìm số ngoại tệ trong nội dung, vì đã biết chắc số VND phân bổ).
  const attachTokhaiSplit = (kind, rowId, allocations) => {
    const row = rows.find(r => r.id === rowId);
    if (!row || !allocations.length) return;
    let updatedList = tokhaiListOf(kind);
    allocations.forEach(a => {
      const tk = updatedList.find(t => t.id === a.tokhaiId);
      if (!tk) return;
      const bankAmt = tk.tyGiaTinhThue > 0 ? Math.round((a.amtVND / tk.tyGiaTinhThue) * 100) / 100 : (extractForeignAmt(row.tx.desc, tk.currency) || 0);
      const bankRate = bankAmt > 0 ? Math.round(a.amtVND / bankAmt) : 0;
      const existingPayments = tkPayments(tk).filter(p => p.rowId !== rowId);
      const newPayments = [...existingPayments, { rowId, bankDate: row.tx.date, bankAmt, bankRate, bankVND: a.amtVND }];
      updatedList = updatedList.map(t => t.id !== tk.id ? t : {
        ...t, payments: newPayments,
        linkedRowId: undefined, bankDate: undefined, bankAmt: undefined, bankRate: undefined, bankVND: undefined
      });
    });
    saveTokhaiListOf(kind)(updatedList);
    const primaryTk = updatedList.find(t => t.id === allocations[0].tokhaiId);
    setRowsH(prev => prev.map(r => r.id !== rowId ? r : {
      ...r, confirmed: "yes", confirmedName: (primaryTk && primaryTk.nhaCungCap) || r.confirmedName,
      confirmedHach: r.confirmedHach || defaultHachOf(kind), manualConfirm: true, confirmedToKhaiId: allocations[0].tokhaiId
    }));
    const summary = allocations.map(a => {
      const t = updatedList.find(tk => tk.id === a.tokhaiId);
      return (t ? t.toKhaiSo : "?") + ": " + fmt(a.amtVND, "VND");
    }).join(", ");
    showToast("✓ Đã gối đầu thanh toán cho " + allocations.length + " tờ khai (" + summary + ")");
  };
  // splitFlow/splitFlowXK theo dõi tiến trình đang gối đầu cho 1 giao dịch: còn dư bao nhiêu
  // (remainingVND) và đã phân bổ cho tờ khai nào rồi (allocations) — mỗi lần bấm "⤵ Gối đầu" sẽ trừ
  // dần phần dư cho tới khi hết (hoặc người dùng đóng bảng, phần dư còn lại coi như bỏ qua).
  const [splitFlow, setSplitFlow] = useState(null);
  const [splitFlowXK, setSplitFlowXK] = useState(null);
  // customAmt: người dùng tự gõ số tiền muốn gắn cho tờ khai này (VD tổng 5.000$, muốn gắn đúng
  // 3.000$ cho lô 1 dù công nợ còn thiếu của lô 1 khác con số đó) — nếu bỏ trống (null/undefined)
  // thì dùng số đề xuất tự động (= min(số còn dư, công nợ còn thiếu của tờ khai)) như trước.
  const handlePickSplit = (kind, tkId, customAmt) => {
    const rowId = tokhaiPickForRowOf(kind);
    const row = rows.find(r => r.id === rowId);
    const tk = tokhaiListOf(kind).find(t => t.id === tkId);
    if (!row || !tk) return;
    const splitFlowCur = splitFlowOf(kind);
    const inFlow = splitFlowCur && splitFlowCur.rowId === rowId;
    const remainingVND = inFlow ? splitFlowCur.remainingVND : Math.max(row.tx.debit || 0, row.tx.credit || 0);
    const tkBalance = Math.max(0, tkTaxVND(tk) - tkTotalPaidVND(tk));
    const suggested = tkBalance > 0 ? Math.min(remainingVND, tkBalance) : remainingVND;
    let allocAmt = (customAmt != null && customAmt !== "") ? Math.max(0, Math.min(parseNum(customAmt, false) || 0, remainingVND)) : suggested;
    if (!allocAmt) { showToast("Số tiền gắn cho tờ khai phải lớn hơn 0", "warn"); return; }
    const leftover = remainingVND - allocAmt;
    const allocations = [...(inFlow ? splitFlowCur.allocations : []), { tokhaiId: tkId, amtVND: allocAmt }];
    if (leftover > 1000) {
      setSplitFlowOf(kind)({ rowId, remainingVND: leftover, allocations });
      showToast("✓ Đã phân bổ " + fmt(allocAmt, "VND") + " cho tờ khai " + tk.toKhaiSo + " — còn dư " + fmt(leftover, "VND") + ", hãy chọn tiếp tờ khai để đặt cọc phần dư (hoặc bấm \"Đóng\" để bỏ qua phần dư).", "warn");
      return;
    }
    attachTokhaiSplit(kind, rowId, allocations);
    setSplitFlowOf(kind)(null);
    setTokhaiPickForRowOf(kind)(null);
    setTokhaiModalOpenOf(kind)(false);
  };
  // Chiều dấu lãi/lỗ khi TỰ ĐỘNG suy ra từ chênh lệch (diff = bankVND - taxVND) khác nhau giữa NK
  // và XK vì bản chất tài khoản ngược nhau:
  //  • NK (331 — công nợ PHẢI TRẢ): trả ÍT hơn ghi nhận (diff < 0) = LÃI (nợ giảm có lợi).
  //  • XK (131 — công nợ PHẢI THU): thu NHIỀU hơn ghi nhận (diff > 0) = LÃI (thu về nhiều hơn có lợi).
  // Công thức hạch toán 2 dòng (Nợ=hach/Có=515 khi lãi; Nợ=635/Có=hach khi lỗ) thì GIỐNG NHAU cho cả
  // 2 loại — chỉ khác đúng chiều suy luận lãi/lỗ này (xem buildFxDiffPreview, không đổi).
  const fxKindFromDiff = (kind, diff) => ((kind === "XK") ? diff > 0 : diff < 0) ? "gain" : "loss";
  // Tự hạch toán chênh lệch tỷ giá khi TỔNG tất cả các lần đã thanh toán (bankVND, có thể gồm
  // nhiều lần khác ngày) khác tổng trị giá ghi nhận ban đầu theo tờ khai (taxVND) — áp dụng vào
  // ĐÚNG dòng giao dịch cuối cùng (đóng nợ). Chỉ lưu "diff" (số tuyệt đối) trên dòng — số tiền THẬT
  // của dòng đó (own) được lấy lại đúng lúc xuất UNT/UNC, nên vẫn đúng dù có 1 hay nhiều lần
  // thanh toán khác nhau cho cùng 1 tờ khai.
  const applyFxDiff = (kind, rowId, taxVND, bankVND) => {
    const diff = bankVND - taxVND;
    if (!diff) { showToast("Không có chênh lệch để hạch toán"); return; }
    const fxKind = fxKindFromDiff(kind, diff);
    setRowsH(prev => prev.map(r => r.id !== rowId ? r : {
      ...r, fxSplit: { kind: fxKind, diff: Math.abs(diff) }
    }));
    showToast("✓ Đã hạch toán chênh lệch tỷ giá " + (fxKind === "gain" ? "LÃI (515)" : "LỖ (635)") + ": " + fmt(Math.abs(diff), "VND"));
  };
  // Cho sửa tay TRỰC TIẾP ngay ở bảng Tờ Khai NK/XK (cột Chênh lệch) sau khi đã bấm "HT Lãi/Lỗ" —
  // không cần phải bấm "Xuất lãi/lỗ đã chọn" mới có chỗ chỉnh sửa như trước. signedVal ÂM = LÃI
  // (515), DƯƠNG = LỖ (635) — quy ước NÀY GIỮ NGUYÊN cho cả NK/XK vì là người dùng tự gõ trực tiếp
  // ý định (lãi/lỗ), không phải suy ra từ diff nên không cần đảo chiều. Giá trị 0 = bỏ hạch toán.
  const editFxDiff = (rowId, signedVal) => {
    const val = Math.round(signedVal || 0);
    if (!val) {
      setRowsH(prev => prev.map(r => r.id !== rowId ? r : { ...r, fxSplit: undefined }));
      showToast("Đã bỏ hạch toán chênh lệch tỷ giá (bằng 0)", "warn");
      return;
    }
    const kind = val < 0 ? "gain" : "loss";
    setRowsH(prev => prev.map(r => r.id !== rowId ? r : { ...r, fxSplit: { kind, diff: Math.abs(val) } }));
    showToast("✓ Đã sửa chênh lệch tỷ giá " + (kind === "gain" ? "LÃI (515)" : "LỖ (635)") + ": " + fmt(Math.abs(val), "VND"));
  };
  // Xuất lãi/lỗ tỷ giá CHỈ CHO CÁC TỜ KHAI ĐÃ TICK CHỌN trong bảng. Trước đây chỉ xuất đúng những
  // dòng ĐÃ BẤM "⚖ HT Lãi/Lỗ" riêng lẻ trước đó — nên chọn nhiều tờ khai nhưng chưa kịp bấm tay
  // từng dòng thì xuất ra thiếu. Giờ tự động ÁP DỤNG hạch toán cho MỌI tờ khai đã chọn mà còn thiếu
  // (chưa bấm), rồi hiện màn XEM TRƯỚC cho sửa tay trước khi thật sự xuất file.
  const exportFxDiffForTk = (kind, tkIds) => {
    let workingRows = rows;
    const rowIds = new Set();
    tkIds.forEach(tkId => {
      const tk = tokhaiListOf(kind).find(t => t.id === tkId);
      if (!tk) return;
      const payments = tkPayments(tk);
      if (!payments.length) return;
      const lastRowId = payments[payments.length - 1].rowId;
      const lastRow = workingRows.find(r => r.id === lastRowId);
      if (lastRow && !lastRow.fxSplit) {
        const diff = tkTotalPaidVND(tk) - tkTaxVND(tk);
        if (diff) {
          const fxKind = fxKindFromDiff(kind, diff);
          workingRows = workingRows.map(r => r.id === lastRowId ? { ...r, fxSplit: { kind: fxKind, diff: Math.abs(diff) } } : r);
        }
      }
      payments.forEach(p => rowIds.add(p.rowId));
    });
    if (workingRows !== rows) setRowsH(() => workingRows);
    const preview = buildFxDiffPreview(workingRows, rowIds);
    if (!preview.length) { showToast("Không có chênh lệch nào để hạch toán trong các tờ khai đã chọn", "warn"); return; }
    setFxPreviewRows(preview);
    setFxPreviewOpen(true);
  };
  // Nhập nhiều file tờ khai cùng lúc — nếu số tờ khai đã có sẵn trong danh sách (trùng số) thì bỏ
  // qua, không thêm lại lần nữa, để tránh nhân đôi khi người dùng lỡ chọn lại file cũ.
  const handleImportTokhai = async (kind, files) => {
    const fileArr = Array.from(files || []);
    if (!fileArr.length) return;
    let list = tokhaiListOf(kind);
    // Ghi chi tiết TỪNG FILE (không chỉ đếm số lượng) để hiện rõ trong alert cuối cùng — tránh tình
    // trạng người dùng bấm nhập nhưng không rõ đã xảy ra chuyện gì (VD tưởng "không nhập được" trong
    // khi thực ra là bị bỏ qua vì tờ khai đó đã có sẵn từ trước).
    const detail = [];
    for (const file of fileArr) {
      try {
        const buf = await file.arrayBuffer();
        const wb = XLSX.read(buf, { type: "array" });
        const parsed = parseToKhaiWorkbook(wb, kind);
        if (!parsed) { detail.push(`✗ ${file.name}: không tìm thấy dữ liệu tờ khai hợp lệ trong file (thiếu nhãn "Số tờ khai")`); continue; }
        const existing = list.find(t => t.toKhaiSo && parsed.toKhaiSo && t.toKhaiSo === parsed.toKhaiSo);
        if (existing) { detail.push(`⏭ ${file.name}: tờ khai số ${parsed.toKhaiSo} đã có sẵn trong danh sách (bỏ qua, không nhập trùng)`); continue; }
        list = [...list, parsed];
        detail.push(`✓ ${file.name}: đã nhập tờ khai số ${parsed.toKhaiSo} — ${parsed.nhaCungCap || "(chưa rõ khách hàng)"}`);
      } catch (e) {
        detail.push(`✗ ${file.name}: lỗi đọc file — ${e.message || e}`);
      }
    }
    if (list !== tokhaiListOf(kind)) saveTokhaiListOf(kind)(list);
    alert("Kết quả nhập tờ khai:\n\n" + detail.join("\n"));
  };

  // Fix amount directly from raw sao ke text — clears rawAmt so mismatch won't re-trigger
  const fixAmtRow = (id, correctDebit, correctCredit) => {
    setRowsH(prev => prev.map(r => r.id !== id ? r : {
      ...r,
      tx: {
        ...r.tx,
        debit: correctDebit,
        credit: correctCredit,
        rawAmt: null  // cleared: amount is now correct, no mismatch on reload
      }
    }));
    // saveNow is called automatically inside setRowsH above
  };

  // Tỷ giá quy đổi USD→VND cho 1 giao dịch — lưu riêng trên dòng (không phụ thuộc trạng thái xác
  // nhận) để dùng khi xuất UNT/UNC; ưu tiên tỷ giá đã lưu này thay vì tự động lấy qua mạng, vì tự
  // lấy có thể lỗi (CORS/không có mạng) hoặc người dùng muốn dùng đúng tỷ giá ghi trên chứng từ.
  const setRowTyGia = (id, tyGia) => {
    setRowsH(prev => prev.map(r => r.id !== id ? r : { ...r, tyGia }));
  };

  // Thêm dữ liệu sao kê mới vào phiên đang làm việc — lưu TRỰC TIẾP, không phụ thuộc ref timing
  const addMoreSaoke = async () => {
    if (!addText.trim() || addBusy) return;
    setAddBusy(true);
    try {
      const tabId = activeTabAccId;                 // chốt tab tại thời điểm bấm
      const currency = activeTabAcc ? activeTabAcc.currency : "VND";
      const newSaoke = parseSaoke(addText, currency);
      if (!newSaoke.length) { showToast && showToast("Không nhận diện được giao dịch nào"); setAddBusy(false); return; }
      const apiKey = LS.get("api_key") || "";
      const newResults = await runMatching(newSaoke, invDV||[], invDR||[], coDict, globalDict, apiKey, () => {}, co && co.name);
      const keyOf = r => (r.tx.date||"") + "|" + (r.tx.desc||"").trim() + "|" + Math.max(r.tx.debit||0, r.tx.credit||0);
      const existKeys = new Set(rows.map(keyOf));
      const uniqueNew = newResults.filter(nr => !existKeys.has(keyOf(nr)));
      if (!uniqueNew.length) { showToast && showToast("Tất cả giao dịch đã có sẵn (trùng lặp)"); setAddBusy(false); return; }
      const mergedRows = [...rows, ...uniqueNew];
      // ── LƯU TRỰC TIẾP & ĐẦY ĐỦ vào đúng key của tab (atomic) ──
      const saveKey = tabId ? co.id+"_"+tabId : co.id;
      const existing = LS.get("session_"+saveKey) || {};
      const mergedRaw = ((existing.rawSaoke||"") + "\n" + addText).trim();
      saveCoInvoices(co.id, invDV, invDR); // hoá đơn dùng chung
      const baseA = {...existing, accountId: tabId, invDV: [], invDR: [], rawSaoke: mergedRaw, currency: currency};
      let ok = LS.set("session_"+saveKey, {...baseA, results: slimRows(mergedRows)});
      if (ok === false) ok = LS.set("session_"+saveKey, {...baseA, results: slimRowsHard(mergedRows)});
      if (ok === false) { cleanupOrphanStorage(); ok = LS.set("session_"+saveKey, {...baseA, results: slimRowsHard(mergedRows)}); }
      addToSessionIndex(co.id, saveKey);
      if (ok === false) { showToast && showToast("⚠ Bộ nhớ trình duyệt đầy, không lưu được. Hãy xoá bớt công ty/dữ liệu cũ.", "warn"); setAddBusy(false); return; }
      // Cập nhật cache + state (giữ undo)
      rowsCache.current[String(tabId)] = mergedRows;
      undoStack.current = [...undoStack.current.slice(-29), rows];
      redoStack.current = [];
      setRows(mergedRows);
      showToast && showToast("✓ Đã thêm " + uniqueNew.length + " giao dịch mới");
      setAddText("");
      setAddMode(false);
    } catch (e) {
      showToast && showToast("Lỗi xử lý: " + (e.message||e));
    }
    setAddBusy(false);
  };

  // Ghi đè toàn bộ: xoá sạch dữ liệu sao kê + kết quả đối chiếu hiện có của tài khoản này,
  // thay bằng đúng dữ liệu vừa dán vào — dùng khi cần dán lại sao kê để sửa dòng bị lỗi/sai sót
  // (VD dòng bị mất số tiền do lỗi copy trước đây), thay vì phải xoá tay từng dòng cũ.
